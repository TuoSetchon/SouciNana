services:
  - type: web
    name: bonpro
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bonpro-db
          property: connectionString
      - key: ADMIN_PHONE
        value: "0788589231"
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: bonpro-db
    plan: basic-256mb
    region: frankfurt
