<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7a4b">
<meta name="description" content="SouciNana, le réseau social de la Côte d'Ivoire">
<title>SouciNana</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--pri:#0b7a4b;--pri2:#e7f5ee;--acc:#f28c28;--bg:#f0f2f5;--card:#fff;--tx:#1c1e21;--mu:#65676b;--bd:#e4e6eb;--red:#e0245e;--in:#f0f2f5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.4}
a{color:var(--pri);text-decoration:none}
h2{font-size:20px}h3{font-size:17px;margin-bottom:6px}
header.top{position:fixed;top:0;left:0;right:0;height:54px;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 1px 2px rgba(0,0,0,.1);z-index:20}
.logo{font-weight:900;font-size:24px;color:var(--pri);letter-spacing:-.8px}
.top-actions{display:flex;gap:8px}
.ic{position:relative;border:0;background:var(--in);width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--tx)}
.badge{position:absolute;top:-3px;right:-3px;background:#e41e3f;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
main{max-width:680px;margin:0 auto;padding:62px 0 76px}
main>*:not(.edge){margin-left:8px;margin-right:8px}
.demo{background:#fff3cd;color:#8a6d00;font-size:12px;text-align:center;padding:5px;border-radius:8px;margin-bottom:8px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;height:58px;background:var(--card);display:flex;border-top:1px solid var(--bd);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mu);font-size:10.5px;position:relative}
nav.bottom a .i{font-size:22px;line-height:1.1}
nav.bottom a.on{color:var(--pri);font-weight:700}
nav.bottom a.on::before{content:"";position:absolute;top:0;left:18%;right:18%;height:3px;background:var(--pri);border-radius:0 0 3px 3px}
nav.bottom .badge{top:3px;right:calc(50% - 24px)}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}.center{justify-content:center;text-align:center}
.grow{flex:1;min-width:0}
.muted{color:var(--mu)}.small{font-size:13px}.tiny{font-size:12px}
.av{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.btn{border:0;background:var(--in);color:var(--tx);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.pri{background:var(--pri);color:#fff}.btn.acc{background:var(--acc);color:#fff}.btn.red{background:#d93025;color:#fff}.btn.soft{background:var(--pri2);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--mu)}
.btn.full{width:100%;margin-top:8px}.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.6}
input,textarea,select{width:100%;border:1px solid var(--bd);border-radius:8px;padding:11px;font:inherit;background:#f7f8fa;margin-bottom:8px;color:var(--tx)}
textarea.big{min-height:90px}
label.lbl{display:block;font-size:13px;color:var(--mu);margin:4px 0 4px}
/* composer façon Facebook */
.composer .pill{flex:1;background:var(--in);border-radius:20px;padding:10px 14px;color:var(--mu);cursor:pointer;text-align:left;border:0;font:inherit}
.composer .qa{display:flex;border-top:1px solid var(--bd);margin-top:10px;padding-top:6px}
.composer .qa button{flex:1;border:0;background:none;padding:7px 2px;font-weight:600;color:var(--mu);font-size:13px;cursor:pointer;border-radius:6px}
/* stories */
.stories{display:flex;gap:8px;overflow-x:auto;padding:2px 8px 10px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 100px;height:170px;border-radius:12px;background:#c9ccd1 center/cover;position:relative;overflow:hidden;color:#fff;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.story::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.6))}
.story .sav{position:absolute;top:8px;left:8px;z-index:1;border:3px solid var(--pri);border-radius:50%;display:flex}
.story.seen .sav{border-color:#c9ccd1}
.story .snm{position:absolute;bottom:8px;left:8px;right:8px;z-index:1;font-size:12.5px;font-weight:700;line-height:1.2}
.story .stx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:800;font-size:13px}
.story.new{background:var(--card);color:var(--tx)}
.story.new::after{display:none}
.story.new .top{height:110px;background:#ddd center/cover}
.story.new .plus{position:absolute;top:94px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;border:3px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.story.new .snm{color:var(--tx);text-align:center}
.sviewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;color:#fff}
.sbars{display:flex;gap:4px;padding:10px 10px 0}
.sbars span{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.sbars span i{display:block;height:100%;background:#fff;width:0}
.sbars span.done i{width:100%}
.sbars span.cur i{animation:sprog 5s linear forwards}
@keyframes sprog{to{width:100%}}
.shead{display:flex;align-items:center;gap:8px;padding:10px}
.sbody{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sbody img{max-width:100%;max-height:100%;object-fit:contain}
.sbody .stext{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:26px;font-weight:800}
.szone{position:absolute;top:0;bottom:0;width:35%;z-index:2}
.sfoot{padding:10px;display:flex;gap:8px;align-items:center}
.sfoot input{margin:0;border-radius:20px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
/* publications */
.post{padding:12px 0 4px}.post>*{padding-left:12px;padding-right:12px}
.post-head{display:flex;gap:10px;align-items:flex-start}
.name{font-weight:700;color:var(--tx)}
.post-text{margin:8px 0;word-wrap:break-word}
.more{color:var(--mu);font-weight:600;cursor:pointer}
.pgrid{display:grid;gap:2px;padding:0!important;margin:8px 0 4px}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;background:#ddd}
.pgrid.g1 img{max-height:560px;height:auto}
.pgrid.g2,.pgrid.g4{grid-template-columns:1fr 1fr}.pgrid.g2 img,.pgrid.g4 img{aspect-ratio:1}
.pgrid.g3{grid-template-columns:1fr 1fr}.pgrid.g3 img{aspect-ratio:1}.pgrid.g3 img:first-child{grid-column:1/3;aspect-ratio:2/1}
.imgph{display:block;width:calc(100% - 24px);margin:8px 12px;padding:22px;border:1px dashed #b0b3b8;border-radius:10px;background:var(--in);color:var(--mu);font-weight:600;cursor:pointer;font-size:14px}
.bgpost{min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;color:#fff;padding:26px 20px!important;margin:8px 0;word-break:break-word;line-height:1.3}
.bgpost.ci{color:#1c1e21;text-shadow:0 0 8px #fff,0 0 2px #fff}
.alert-bn{margin:8px 12px 0!important;padding:8px 12px!important;border-radius:8px;color:#fff;font-weight:700;font-size:14px}
.shared{border:1px solid var(--bd);border-radius:10px;margin:6px 12px!important;padding:10px!important;cursor:pointer}
.poll{margin:8px 0}
.popt{position:relative;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;padding:10px 12px;cursor:pointer;overflow:hidden;background:var(--card)}
.popt .bar{position:absolute;left:0;top:0;bottom:0;background:var(--pri2);z-index:0;transition:width .3s}
.popt.mine{border-color:var(--pri)}
.popt .lb{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px;font-weight:600}
.post-stats{display:flex;justify-content:space-between;align-items:center;padding-top:6px;padding-bottom:6px}
.remo{display:inline-flex;align-items:center;cursor:pointer}
.remo span{width:20px;height:20px;border-radius:50%;background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:13px;margin-right:-4px;box-shadow:0 0 0 2px var(--card)}
.post-actions{display:flex;border-top:1px solid var(--bd);margin:0 12px;padding:2px 0 0!important}
.post-actions button{flex:1;border:0;background:none;padding:9px 4px;color:var(--mu);font-weight:600;border-radius:6px;cursor:pointer;font-size:14px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.post-actions button:active{background:var(--in)}
.rpick{display:flex;justify-content:space-around;padding:6px 0 12px}
.rpick button{border:0;background:none;font-size:34px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s}
.rpick button:active{transform:scale(1.3)}
.rpick small{font-size:11px;color:var(--mu)}
.cmt{display:flex;gap:8px;margin-top:8px}
.cmt.reply{margin-left:40px}
.cmt .bub{background:var(--in);border-radius:16px;padding:7px 11px;display:inline-block;max-width:100%;word-wrap:break-word}
.cmt .cact{font-size:12px;color:var(--mu);margin:2px 0 0 10px;display:flex;gap:12px}
.cmt .cact b{cursor:pointer}
.comment-box{margin:10px 0 6px}.comment-box input{margin:0;border-radius:20px}
.tag{padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;display:inline-block}
.tag.acc{background:#fde7d2;color:#b25b0b}.tag.ok{background:#d7f2e4;color:var(--pri)}.tag.wait{background:#fff3cd;color:#8a6d00}.tag.no{background:#fde0de;color:#d93025}.tag.blue{background:#e7f0fd;color:#1a5fd0}
.ad{border:1px solid #fbd3ad}
/* profil */
.profile{padding:0;overflow:hidden;text-align:center;padding-bottom:12px}
.cover{height:170px;background:linear-gradient(135deg,var(--pri),var(--acc));background-size:cover;background-position:center}
.pav{margin-top:-56px;display:flex;justify-content:center}.pav .av{border:4px solid var(--card)}
.profile h2{margin-top:6px;font-size:24px}.profile p{margin:4px 12px}
.counts{display:flex;justify-content:center;gap:18px;margin:8px 0}
.ptabs{display:flex;border-top:1px solid var(--bd);margin-top:12px;overflow-x:auto}
.ptabs a{flex:1;padding:12px 6px;color:var(--mu);font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
.ptabs a.on{color:var(--pri);border-color:var(--pri)}
.about div{display:flex;gap:10px;padding:8px 0;align-items:center}.about span:first-child{font-size:20px;width:28px;text-align:center}
.grid-friends{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.fcell{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx);font-size:13px;text-align:center}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;border-radius:4px}
.list-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);color:inherit}.list-item:last-child{border:0}
.chips,.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chip{border:0;background:var(--card);padding:8px 13px;border-radius:18px;white-space:nowrap;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--tx)}.chip.on{background:var(--pri);color:#fff}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pcard{flex:0 0 150px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;text-align:center;padding-bottom:8px}
.pcard .ph{height:110px;display:flex;align-items:center;justify-content:center}
.market{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mitem{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mitem .ph{aspect-ratio:1;background:#dde3e8 center/cover;display:flex;align-items:center;justify-content:center;font-size:40px}
.mitem .in{padding:8px}.mitem b{display:block;font-weight:600}.price{color:var(--tx);font-weight:800}
.chat{display:flex;flex-direction:column;height:calc(100vh - 140px)}
.chatbox{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:8px 12px;border-radius:18px;background:var(--card)}
.msg.me{align-self:flex-end;background:var(--pri);color:#fff}
.msg.me a{color:#fff;text-decoration:underline}
.msg .t{font-size:11px;opacity:.7;display:block;text-align:right}
.chat .send{display:flex;gap:6px;padding-top:6px}.chat .send input{margin:0;border-radius:20px}
.notif{display:flex;gap:10px;padding:10px;border-radius:8px;align-items:center;cursor:pointer}.notif.unread{background:var(--pri2)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mgrid a{background:var(--card);border-radius:10px;padding:12px;color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:6px;font-size:14px}
.mgrid a span{font-size:24px}
.menu a{display:flex;gap:12px;align-items:center;padding:12px 6px;color:var(--tx);font-weight:600;border-bottom:1px solid var(--bd)}
.menu a:last-child{border:0}.menu a span{font-size:22px;width:30px;text-align:center}
.switch{display:flex;align-items:center;justify-content:space-between;padding:12px 6px;font-weight:600;gap:10px}
.switch input{width:auto;margin:0;transform:scale(1.4)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:680px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow-y:auto;animation:up .2s}
.sheet.photo{background:#000;padding:0;border-radius:0;max-height:100vh;height:100vh;display:flex;align-items:center;justify-content:center}
.sheet.photo img{max-width:100%;max-height:100%}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:13px 6px;font-size:15px;border-bottom:1px solid var(--bd);cursor:pointer;color:var(--tx)}
.opt:last-child{border:0}
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.offer{border:2px solid var(--bd);border-radius:10px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;cursor:pointer;font-size:14px}
.offer input{display:none}.offer:has(input:checked){border-color:var(--acc);background:#fff6ec}
.pay{background:var(--in);border-radius:10px;padding:10px;margin-bottom:10px;font-size:14px}.pay ol{margin:6px 0 0 18px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.25s;z-index:80;font-size:14px;max-width:90%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:20px;max-width:420px;margin:0 auto}
.auth-hero{text-align:center;margin-bottom:18px}.auth-logo{font-size:42px;font-weight:900;color:var(--pri);letter-spacing:-1px}
.auth-card h2{margin-bottom:12px}
.flag{display:inline-block;width:22px;height:15px;background:linear-gradient(90deg,#f77f00 33%,#fff 33% 66%,#009e60 66%);border-radius:2px;vertical-align:-2px;box-shadow:0 0 0 1px #ddd}
.sep{height:1px;background:var(--bd);margin:14px 0}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--card);border-radius:10px;padding:12px}.stat b{font-size:22px;display:block;color:var(--pri)}
.back{display:inline-block;margin-bottom:8px;font-weight:600}
.imgprev{display:none;width:100%;border-radius:8px;margin-bottom:8px;max-height:260px;object-fit:cover}
.greet{padding:4px 2px 8px}.greet b{font-size:18px}
/* création de publication */
.ctool{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ctool button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:10px;font-weight:600;font-size:13.5px;cursor:pointer;text-align:left;color:var(--tx)}
.ctool button.on{border-color:var(--pri);background:var(--pri2)}
.bgs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.bgs button{flex:0 0 34px;height:34px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.bgs button.on{border-color:var(--tx)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.thumbs div{position:relative;width:78px;height:78px}
.thumbs img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.thumbs button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.65);color:#fff;width:22px;height:22px;border-radius:50%;font-size:12px}
.ctext{border:0;background:transparent;font-size:18px;min-height:110px;resize:vertical;padding:6px 0}
.ctext.onbg{color:#fff;font-weight:800;text-align:center;font-size:22px;border-radius:10px;padding:40px 16px;min-height:200px}
.ctext.onbg.ci{color:#1c1e21}
.ctext.onbg::placeholder{color:rgba(255,255,255,.85)}
.evdate{flex:0 0 52px;height:56px;border-radius:10px;background:var(--pri2);color:var(--pri);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1}
.evdate small{font-size:11px;text-transform:uppercase}
.evcover{height:150px;background:linear-gradient(135deg,var(--acc),#e8505b) center/cover;border-radius:10px 10px 0 0;margin:-12px -12px 10px}
@media print{header.top,nav.bottom,.back,.demo,.btn{display:none!important}main{padding:0}.card{box-shadow:none}}
</style>
</head>

const fail=e=>{console.warn(e);toast(e&&e.code==='permission-denied'?'Action non autorisée':'Problème de connexion, réessayez');};
const clean=o=>JSON.parse(JSON.stringify(o));
const INC_KEYS=['shares','views','clicks'];
const MAP_KEYS=['reactions','votes'];
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function diffDoc(old,neu){
  const upd={};
  for(const k of new Set([...Object.keys(old),...Object.keys(neu)])){
    const o=old[k],n=neu[k];if(JSON.stringify(o)===JSON.stringify(n))continue;
    if(MAP_KEYS.includes(k)&&isObj(o)&&isObj(n)){
      for(const sk of new Set([...Object.keys(o),...Object.keys(n)]))
        if(JSON.stringify(o[sk])!==JSON.stringify(n[sk]))upd[k+'.'+sk]=n[sk]===undefined?FV.delete():clean(n[sk]);
    }else if(Array.isArray(o)&&Array.isArray(n)){
      const os=o.map(x=>JSON.stringify(x)),ns=n.map(x=>JSON.stringify(x));
      const add=n.filter((x,i)=>!os.includes(ns[i])),rem=o.filter((x,i)=>!ns.includes(os[i]));
      upd[k]=(add.length&&rem.length)?clean(n):add.length?FV.arrayUnion(...clean(add)):FV.arrayRemove(...clean(rem));
    }else if(INC_KEYS.includes(k)&&typeof o==='number'&&typeof n==='number')upd[k]=FV.increment(n-o);
    else upd[k]=n===undefined?FV.delete():clean(n);
  }
  return upd;
}

  for(const c of COLS){
    const b=base[c]||{},nb={},cur={};
    S[c].forEach(d=>{if(!d.id)d.id=uid();cur[d.id]=d;});
    for(const id in cur){
      const js=JSON.stringify(cur[id]);nb[id]=js;if(js===b[id])continue;
      const ref=db.collection(c).doc(id);
      if(b[id]&&PATCH.includes(c)){const u=diffDoc(JSON.parse(b[id]),cur[id]);if(Object.keys(u).length)ref.update(u).catch(fail);}
      else ref.set(clean(cur[id])).catch(fail);
    }
    for(const id in b)if(!(id in cur))db.collection(c).doc(id).delete().catch(fail);
    base[c]=nb;
  }
}

function authErr(e){const c=(e&&e.code)||'';
  if(c.includes('email-already-in-use'))return 'Ce numéro a déjà un compte';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')||c.includes('invalid-email'))return 'Numéro ou mot de passe incorrect';
  if(c.includes('weak-password'))return 'Mot de passe trop faible (6 caractères minimum)';
  if(c.includes('network'))return 'Pas de connexion internet';

async function doLogin(){
  const id=$('#lphone').value,pw=$('#lpw').value;
  if(!id||!pw)return toast('Entrez votre numéro et votre mot de passe');
  if(ONLINE){busy(true);try{await auth.signInWithEmailAndPassword(toEmail(id),pw);location.hash='#/feed';}catch(e){toast(authErr(e));}busy(false);return;}
  const ph=normPhone(id);
  const u=S.users.find(x=>x.phone&&normPhone(x.phone)===ph&&x.pw===hashPw(pw));
  if(!u)return toast('Numéro ou mot de passe incorrect');
  if(u.blocked)return toast("Ce compte a été suspendu par l'administrateur");
  S.session=u.id;save();location.hash='#/feed';render();
}
async function doRegister(){
  const name=$('#rname').value.trim(),ph=normPhone($('#rphone').value),city=normCity($('#rcity').value),q=$('#rq').value.trim(),pw=$('#rpw').value;
  if(name.length<3)return toast('Entrez votre nom complet');
  if(!/^\+?\d{8,14}$/.test(ph))return toast('Numéro de téléphone invalide');
  if(city.length<2)return toast('Indiquez votre ville');
  const gender=$('#rgender').value,bday=$('#rbday').value;
  if(!gender)return toast('Indiquez votre sexe');
  if(!bday||ageOf(bday)<13)return toast('Indiquez votre date de naissance (13 ans minimum)');
  if(pw.length<6)return toast('Mot de passe : 6 caractères minimum');
  const welcome=`Bienvenue sur ${CONFIG.appName}, ${first(name)} ! Ajoutez une photo de profil et retrouvez vos amis.`;
  const profile={name,city,quartier:q,gender,birthday:bday,interests:[],bio:'',avatar:null,cover:null,joined:Date.now(),isAdmin:false,blocked:false,saved:[],hidden:[]};
  if(ONLINE){
    busy(true);
    try{
      const cred=await auth.createUserWithEmailAndPassword(toEmail(ph),pw);const id=cred.user.uid;
      await db.collection('users').doc(id).set({id,...profile});
      db.collection('groups').doc('g1').update({members:FV.arrayUnion(id)}).catch(()=>{});
      const n1=uid(),n2=uid();
      db.collection('notifs').doc(n1).set({id:n1,to:id,text:welcome,link:'#/edit-profile',ts:Date.now(),read:false}).catch(()=>{});
      db.collection('notifs').doc(n2).set({id:n2,to:'ADMIN',text:`Nouvelle inscription : ${name} (${city})`,link:'#/admin/users',ts:Date.now(),read:false}).catch(()=>{});
      location.hash='#/feed';
    }catch(e){toast(authErr(e));}
    busy(false);return;
  }
  if(S.users.some(u=>normPhone(u.phone)===ph))return toast('Ce numéro a déjà un compte');
  const u={id:uid(),phone:ph,pw:hashPw(pw),...profile};
  S.users.push(u);
  const g1=S.groups.find(g=>g.id==='g1');if(g1)g1.members.push(u.id);
  notify(u.id,welcome,'#/edit-profile');notify('admin',`Nouvelle inscription : ${name} (${city})`,'#/admin/users');
  S.session=u.id;save();location.hash='#/feed';render();
}

/* ================= AMIS (outils) ================= */
const isFriend=(a,b)=>S.friends.some(f=>(f.a===a&&f.b===b)||(f.a===b&&f.b===a));
function friendStatus(a,b){
  if(isFriend(a,b))return 'friends';
  if(S.requests.some(r=>r.from===a&&r.to===b))return 'sent';
  if(S.requests.some(r=>r.from===b&&r.to===a))return 'received';
  return 'none';
}
function friendsOf(id){return S.friends.filter(f=>f.a===id||f.b===id).map(f=>U(f.a===id?f.b:f.a)).filter(u=>u&&!u.blocked);}
function mutual(a,b){const fa=new Set(friendsOf(a).map(u=>u.id));return friendsOf(b).filter(u=>fa.has(u.id)).length;}
function suggestions(n=20){
  const me=ME();
  return S.users.filter(u=>u.id!==me.id&&!u.blocked&&!u.isAdmin&&friendStatus(me.id,u.id)==='none')
    .map(u=>({u,score:mutual(me.id,u.id)*3+(u.city&&u.city===me.city?2:0)}))
    .sort((a,b)=>b.score-a.score).slice(0,n).map(x=>x.u);
}

  if(CD.sharedFrom){const o=S.posts.find(x=>x.id===CD.sharedFrom);if(o){o.shares=(o.shares||0)+1;if(o.author!==me.id)notify(o.author,`${me.name} a partagé votre publication`,'#/post/'+p.id);}}
  CD=null;save();toast(p.kind==='alert'?'Alerte publiée pour '+(p.city||'votre ville')+' ⚠️':'Publication partagée ✅');
  nav(gid?'#/group/'+gid:pid?'#/page/'+pid:'#/feed');
}

/* ================= CARTE DE PUBLICATION ================= */
function reactsOf(p){const m={};(p.likes||[]).forEach(u=>m[u]='like');Object.assign(m,p.reactions||{});return m;}
function imgsOf(p){return (p.imgs&&p.imgs.length)?p.imgs:(p.img?[p.img]:[]);}
function imgGrid(p){
  const im=imgsOf(p);if(!im.length)return '';
  if(SAVER&&!revealed.has(p.id))return `<button class="imgph" onclick="revealed.add('${p.id}');render()">📷 ${plural(im.length,'photo')} masquée${im.length>1?'s':''} · Touchez pour afficher<br><small>Mode économie de données activé</small></button>`;
  const shown=im.slice(0,4);
  return `<div class="pgrid g${shown.length}">${shown.map((s,i)=>`<img src="${esc(s)}" alt="" loading="lazy" onclick="photoView(this.src)">`).join('')}</div>`;
}
function textBlock(p){
  if(!p.text)return '';
  if(p.bg&&BGS[p.bg]&&!imgsOf(p).length)return `<div class="bgpost ${p.bg==='ci'?'ci':''}" style="background:${BGS[p.bg]}">${fmtText(p.text)}</div>`;
  const long=p.text.length>320&&!expanded.has(p.id);
  return `<div class="post-text">${fmtText(long?p.text.slice(0,280)+'…':p.text)}${long?` <span class="more" onclick="expanded.add('${p.id}');render()">Voir plus</span>`:''}</div>`;
}
function pollBlock(p){
  if(!p.poll)return '';const me=ME().id;const votes=p.votes||{};const total=Object.keys(votes).length;const mine=votes[me];
  return `<div class="poll">${p.poll.options.map(o=>{const n=Object.values(votes).filter(v=>v===o.id).length;const pct=total?Math.round(n*100/total):0;
    return `<div class="popt ${mine===o.id?'mine':''}" onclick="vote('${p.id}','${o.id}')"><div class="bar" style="width:${mine?pct:0}%"></div><div class="lb"><span>${mine===o.id?'✔ ':''}${esc(o.text)}</span>${mine?`<span>${pct}%</span>`:''}</div></div>`;}).join('')}
  <div class="muted small">${plural(total,'vote')}${mine?' · Touchez une autre option pour changer':' · Votez pour voir les résultats'}</div></div>`;
}
function vote(pid,oid){const p=S.posts.find(x=>x.id===pid);if(!p)return;const me=ME().id;p.votes=p.votes||{};if(p.votes[me]===oid)delete p.votes[me];else p.votes[me]=oid;save();render();}
function sharedInner(o){
  const a=o.pageId&&P(o.pageId)?{name:P(o.pageId).name}:(U(o.author)||{name:'Utilisateur'});
  const im=imgsOf(o);
  return `<div class="row">${o.pageId&&P(o.pageId)?pageAvatar(P(o.pageId),32):avatar(U(o.author),32)}<div><b class="small">${esc(a.name)}</b><div class="muted tiny">${ago(o.ts)}</div></div></div>
  ${o.text?`<div class="small" style="margin-top:6px">${fmtText(o.text.length>200?o.text.slice(0,200)+'…':o.text)}</div>`:''}
  ${im.length&&!(SAVER&&!revealed.has(o.id))?`<img src="${esc(im[0])}" style="width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin-top:6px" alt="">`:''}`;
}
function postHead(p,spons){
  const a=U(p.author)||{name:'Utilisateur'};const pg=p.pageId?P(p.pageId):null;const g=p.groupId?S.groups.find(x=>x.id===p.groupId):null;
  const tags=(p.tags||[]).map(U).filter(Boolean);
  let nm=pg?`<a class="name" href="#/page/${pg.id}">${esc(pg.name)}</a>`:`<a class="name" href="#/profile/${p.author}">${esc(a.name)}</a>${a.pro?' <span class="tag acc">Pro</span>':''}`;
  if(p.kind==='share')nm+=' <span class="muted">a partagé une publication</span>';
  if(p.feeling)nm+=` <span class="muted">se sent ${p.feeling[0]} ${esc(p.feeling[1])}</span>`;
  if(tags.length)nm+=` <span class="muted">avec</span> ${tags.slice(0,2).map(u=>`<a class="name" href="#/profile/${u.id}">${esc(u.name)}</a>`).join(' <span class="muted">et</span> ')}${tags.length>2?` <span class="muted">et ${tags.length-2} autre(s)</span>`:''}`;
  if(p.place)nm+=` <span class="muted">à</span> <b>${esc(p.place)}</b>`;
  if(g)nm+=` <span class="muted">▸</span> <a class="name" href="#/group/${g.id}">${esc(g.name)}</a>`;
  const av=pg?`<a href="#/page/${pg.id}">${pageAvatar(pg)}</a>`:`<a href="#/profile/${p.author}">${avatar(a)}</a>`;
  return `<div class="post-head">${av}<div class="grow">${nm}<div class="muted tiny">${ago(p.ts)}${p.editedAt?' · Modifié':''} · ${p.audience==='friends'?'👥':'🌍'}${p.city?' · 📍 '+esc(p.city):''}${p.boostedUntil>Date.now()||spons?' · <span class="tag acc">Sponsorisé</span>':''}</div></div>
  <button class="ic" style="background:none" onclick="postMenu('${p.id}')">⋯</button></div>`;
}
function reactStats(p){
  const m=reactsOf(p);const n=Object.keys(m).length;const cm=(p.comments||[]).length;
  if(!n&&!cm&&!p.shares)return '';
  const counts={};Object.values(m).forEach(t=>counts[t]=(counts[t]||0)+1);
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>RX[e[0]]?RX[e[0]][1]:'👍');
  const me=ME().id;const mineR=m[me];
  const lbl=n?(mineR?(n===1?'Vous':`Vous et ${n-1} autre${n>2?'s':''}`):String(n)):'';
  return `<div class="post-stats muted small"><span class="remo" onclick="whoReacted('${p.id}')">${n?`<span>${top.join('</span><span>')}</span>&nbsp;&nbsp;${lbl}`:''}</span><span>${cm?`<a class="muted" href="#/post/${p.id}">${plural(cm,'commentaire')}</a>`:''}${p.shares?` · ${plural(p.shares,'partage')}`:''}</span></div>`;
}
function postCard(p,full,spons){
  const me=ME();const m=reactsOf(p);const mine=m[me.id];const r=mine?RX[mine]:null;
  const al=p.kind==='alert'&&ALERTS[p.alert]?ALERTS[p.alert]:null;
  const sh=p.sharedFrom?S.posts.find(x=>x.id===p.sharedFrom):null;
  return `<article class="card post ${spons?'ad':''}" style="padding-left:0;padding-right:0">
  ${postHead(p,spons)}
  ${al?`<div class="alert-bn" style="background:${al[2]}">${al[0]} ALERTE · ${esc(al[1])}${p.city?' · '+esc(p.city):''}</div>`:''}
  ${textBlock(p)}${pollBlock(p)}${imgGrid(p)}
  ${p.sharedFrom?`<div class="shared" onclick="go('#/post/${p.sharedFrom}')">${sh?sharedInner(sh):'<span class="muted small">Cette publication n\'est plus disponible.</span>'}</div>`:''}
  ${reactStats(p)}
  <div class="post-actions"><button style="${r?'color:'+r[3]:''}" onpointerdown="lpStart('${p.id}')" onpointerup="lpEnd('${p.id}')" onpointerleave="lpCancel()" onpointercancel="lpCancel()" oncontextmenu="event.preventDefault();reactPicker('${p.id}')">${r?r[1]+' '+r[2]:"👍 J'aime"}</button><button onclick="openComments('${p.id}')">💬 Commenter</button><button onclick="shareMenu('${p.id}')">↗️ Partager</button></div>
  ${full?commentsBlock(p):((p.comments||[]).length?`<div style="padding-bottom:6px">${(p.comments||[]).filter(c=>!c.parent).slice(-1).map(c=>commentHtml(c,p)).join('')}${(p.comments||[]).length>1?`<a class="small muted" href="#/post/${p.id}" style="display:block;margin-top:6px;font-weight:600">Voir les ${(p.comments||[]).length} commentaires</a>`:''}</div>`:'')}
  </article>`;
}
function openComments(id){if(location.hash==='#/post/'+id){const c=$('#ctext');c&&c.focus();}else{focusComment=true;go('#/post/'+id);}}
let focusComment=false,replyTo=null;
function commentHtml(c,p,isReply){
  const a=U(c.author)||{name:'Utilisateur'};
  return `<div class="cmt ${isReply?'reply':''}"><a href="#/profile/${c.author}">${avatar(a,isReply?26:32)}</a><div class="grow"><div class="bub"><a class="name small" href="#/profile/${c.author}">${esc(a.name)}</a><div>${fmtText(c.text)}</div></div>
  <div class="cact"><span>${ago(c.ts)}</span><b onclick="replyComment('${p.id}','${c.parent||c.id}','${c.author}')">Répondre</b>${c.author===ME().id||ME().isAdmin?`<b onclick="deleteComment('${p.id}','${c.id}')">Supprimer</b>`:''}</div></div></div>`;
}
function commentsBlock(p){
  const cs=p.comments||[];const tops=cs.filter(c=>!c.parent);const me=ME();
  setTimeout(()=>{if(focusComment){focusComment=false;const c=$('#ctext');c&&c.focus();}},60);
  return `<div style="padding-bottom:8px">${tops.map(c=>commentHtml(c,p)+cs.filter(r=>r.parent===c.id).map(r=>commentHtml(r,p,true)).join('')).join('')||'<p class="muted small" style="margin-top:8px">Soyez le premier à commenter.</p>'}
  ${replyTo&&replyTo.pid===p.id?`<div class="small muted" style="margin-top:8px">Réponse à <b>${esc(replyTo.name)}</b> · <b style="cursor:pointer" onclick="replyTo=null;render()">Annuler</b></div>`:''}
  <div class="row comment-box">${avatar(me,32)}<input id="ctext" placeholder="${replyTo&&replyTo.pid===p.id?'Répondre à '+esc(replyTo.name)+'…':'Écrire un commentaire…'}" onkeydown="if(event.key==='Enter')addComment('${p.id}')"><button class="btn pri sm" onclick="addComment('${p.id}')">➤</button></div></div>`;
}
function replyComment(pid,cid,aid){replyTo={pid,cid,name:first((U(aid)||{}).name)};if(location.hash!=='#/post/'+pid){focusComment=true;go('#/post/'+pid);}else{render();setTimeout(()=>{const c=$('#ctext');c&&c.focus();},50);}}
function addComment(id){
  const i=$('#ctext');const t=i.value.trim();if(!t)return;
  const p=S.posts.find(x=>x.id===id);const me=ME();p.comments=p.comments||[];
  const parent=replyTo&&replyTo.pid===id?replyTo.cid:null;
  p.comments.push({id:uid(),author:me.id,text:t,ts:Date.now(),parent});
  if(p.author!==me.id)notify(p.author,`${me.name} a commenté votre publication`,'#/post/'+id);
  if(parent){const pc=p.comments.find(c=>c.id===parent);if(pc&&pc.author!==me.id&&pc.author!==p.author)notify(pc.author,`${me.name} a répondu à votre commentaire`,'#/post/'+id);}
  replyTo=null;save();render();setTimeout(()=>{const c=$('#ctext');c&&c.focus();},50);
}
function deleteComment(pid,cid){if(!confirm('Supprimer ce commentaire ?'))return;const p=S.posts.find(x=>x.id===pid);p.comments=(p.comments||[]).filter(c=>c.id!==cid&&c.parent!==cid);save();render();}

/* --- Réactions (appui long = choix de la réaction, comme sur Facebook) --- */
let lpT=null,lpFired=false;
function lpStart(id){lpFired=false;clearTimeout(lpT);lpT=setTimeout(()=>{lpFired=true;reactPicker(id);},450);}
function lpEnd(id){clearTimeout(lpT);if(!lpFired)quickLike(id);lpFired=false;}
function lpCancel(){clearTimeout(lpT);}
function quickLike(id){const p=S.posts.find(x=>x.id===id);if(!p)return;react(id,reactsOf(p)[ME().id]?null:'like');}
function reactPicker(id){
  modal(`<div class="rpick">${REACTS.map(r=>`<button onclick="closeModal();react('${id}','${r[0]}')">${r[1]}<small>${r[2]}</small></button>`).join('')}</div><p class="muted small center">Astuce : appuyez longtemps sur « J'aime » pour choisir une réaction</p>`);
}
function react(id,type){
  const p=S.posts.find(x=>x.id===id);if(!p)return;const me=ME();
  p.likes=(p.likes||[]).filter(u=>u!==me.id);p.reactions=p.reactions||{};
  const had=p.reactions[me.id];
  if(!type||had===type)delete p.reactions[me.id];else p.reactions[me.id]=type;
  if(type&&!had&&p.author!==me.id)notify(p.author,`${me.name} a réagi ${RX[type][1]} à votre publication`,'#/post/'+id);
  save();render();
}
function whoReacted(id){
  const p=S.posts.find(x=>x.id===id);const m=reactsOf(p);
  modal(`<h3>Réactions</h3>${Object.entries(m).map(([u,t])=>{const x=U(u);return x?`<a class="list-item" href="#/profile/${u}" onclick="closeModal()">${avatar(x,36)}<b class="grow">${esc(x.name)}</b><span style="font-size:22px">${RX[t]?RX[t][1]:'👍'}</span></a>`:'';}).join('')||empty('Aucune réaction')}`);
}

/* --- Menu ⋯, partage, enregistrement --- */
function postMenu(id){
  const p=S.posts.find(x=>x.id===id);if(!p)return;const me=ME();const mine=p.author===me.id;const saved=(me.saved||[]).includes(id);
  modal(`<button class="opt" onclick="closeModal();toggleSave('${id}')">${saved?'🔖 Retirer des enregistrements':'🔖 Enregistrer la publication'}</button>
  ${mine?`<button class="opt" onclick="closeModal();editPost('${id}')">✏️ Modifier la publication</button><button class="opt" onclick="closeModal();boostModal('${id}')">🚀 Booster cette publication</button>`:`<button class="opt" onclick="closeModal();hidePost('${id}')">🙈 Masquer la publication</button>`}
  ${mine||me.isAdmin?`<button class="opt" onclick="closeModal();deletePost('${id}')">🗑️ Supprimer</button>`:''}
  ${!mine?`<button class="opt" onclick="closeModal();reportModal('${id}')">🚩 Signaler</button>`:''}
  <button class="opt" onclick="closeModal()">Annuler</button>`);
}
function toggleSave(id){const me=ME();me.saved=me.saved||[];if(me.saved.includes(id)){me.saved=me.saved.filter(x=>x!==id);toast('Retiré des enregistrements');}else{me.saved.unshift(id);toast('Publication enregistrée 🔖');}save();render();}
function hidePost(id){const me=ME();me.hidden=[...(me.hidden||[]),id];save();render();toast('Publication masquée');}
function editPost(id){
  const p=S.posts.find(x=>x.id===id);
  modal(`<h3>✏️ Modifier la publication</h3><textarea id="etext" class="big">${esc(p.text)}</textarea><button class="btn pri full" onclick="saveEdit('${id}')">Enregistrer</button><button class="btn ghost full" onclick="closeModal()">Annuler</button>`);
}
function saveEdit(id){const p=S.posts.find(x=>x.id===id);const t=$('#etext').value.trim();if(!t&&!imgsOf(p).length)return toast('La publication ne peut pas être vide');p.text=t;p.editedAt=Date.now();save();closeModal();render();toast('Publication modifiée');}
function shareMenu(id){
  const p=S.posts.find(x=>x.id===id);if(!p)return;
  const base=p.sharedFrom||id;
  const txt=`${(p.pageId&&P(p.pageId)?P(p.pageId).name:(U(p.author)||{}).name)} sur ${CONFIG.appName} : ${p.text||''}`.slice(0,500);
  modal(`<h3>↗️ Partager</h3>
  <button class="opt" onclick="closeModal();shareNow('${base}')">⚡ Partager maintenant (sur mon fil)</button>
  <button class="opt" onclick="closeModal();startCreate('','', '${base}')">✏️ Partager avec un commentaire</button>
  <button class="opt" onclick="closeModal();sendToFriend('${base}')">💬 Envoyer en message à un ami</button>
  <a class="opt" href="https://wa.me/?text=${encodeURIComponent(txt+' — '+location.origin+location.pathname+'#/post/'+base)}" target="_blank" rel="noopener" onclick="countShare('${base}');closeModal()">🟢 Partager sur WhatsApp</a>
  <button class="opt" onclick="closeModal()">Annuler</button>`);
}
function countShare(id){const o=S.posts.find(x=>x.id===id);if(o){o.shares=(o.shares||0)+1;save();}}
function shareNow(id){CD=newDraft('');CD.sharedFrom=id;publish();}
function sendToFriend(id){
  const fr=friendsOf(ME().id);
  modal(`<h3>💬 Envoyer à…</h3>${fr.map(u=>`<button class="opt" onclick="closeModal();sendPostMsg('${u.id}','${id}')">${avatar(u,32)} ${esc(u.name)}</button>`).join('')||empty("Vous n'avez pas encore d'amis.")}`);
}
function sendPostMsg(to,pid){const p=S.posts.find(x=>x.id===pid);S.messages.push({id:uid(),from:ME().id,to,text:'📌 Regarde cette publication : '+((p&&p.text)||'').slice(0,80),postRef:pid,ts:Date.now(),read:false});save();toast('Envoyé ✅');}
function deletePost(id){
  if(!confirm('Supprimer cette publication ?'))return;
  S.posts=S.posts.filter(p=>p.id!==id);S.reports=S.reports.filter(r=>r.postId!==id);save();
  if(location.hash==='#/post/'+id)go('#/feed');else render();toast('Publication supprimée');
}
function reportModal(id){
  const R=['Contenu choquant','Arnaque','Fausse information','Harcèlement','Fausse alerte','Autre'];
  modal(`<h3>🚩 Signaler cette publication</h3>${R.map((r,i)=>`<label class="opt"><input type="radio" name="rr" value="${r}" ${i===0?'checked':''} style="width:auto;margin:0">${r}</label>`).join('')}
  <button class="btn red full" onclick="sendReport('${id}')">Envoyer le signalement</button>`);
}
function sendReport(id){
  const r=document.querySelector('input[name=rr]:checked').value;
  S.reports.unshift({id:uid(),postId:id,user:ME().id,reason:r,ts:Date.now()});
  notify(adminId(),`Publication signalée : ${r}`,'#/admin/reports');save();closeModal();toast("Merci, l'administrateur va vérifier.");
}

/* ================= STORIES (24 h) ================= */
const liveStories=()=>S.stories.filter(s=>s.ts>Date.now()-864e5&&visibleUser(s.author));
function storyAuthors(){
  const me=ME().id;const by={};liveStories().forEach(s=>{(by[s.author]=by[s.author]||[]).push(s);});
  const ids=Object.keys(by).sort((a,b)=>(a===me?-1:b===me?1:0)||((isFriend(me,b)?1:0)-(isFriend(me,a)?1:0))||Math.max(...by[b].map(s=>s.ts))-Math.max(...by[a].map(s=>s.ts)));
  return ids.map(id=>({id,list:by[id].sort((a,b)=>a.ts-b.ts)}));
}
function storiesBar(){
  const me=ME();const au=storyAuthors();
  return `<div class="stories edge"><div class="story new" onclick="go('#/story-new')"><div class="top" style="${me.avatar?`background-image:url('${esc(me.avatar)}')`:`background:${color(me.name)}`}"></div><div class="plus">+</div><div class="snm">Créer une story</div></div>
  ${au.map(a=>{const u=U(a.id);const last=a.list[a.list.length-1];const seen=a.list.every(s=>(s.views||[]).includes(me.id)||s.author===me.id);
    return `<div class="story ${seen?'seen':''}" onclick="go('#/story/${a.id}')" style="${last.img?`background-image:url('${esc(last.img)}')`:`background:${BGS[last.bg]||BGS.g}`}">${last.img?'':`<div class="stx">${esc(last.text||'')}</div>`}<div class="sav">${avatar(u,34)}</div><div class="snm">${a.id===me.id?'Votre story':esc(u.name)}</div></div>`;}).join('')}</div>`;
}
let SD={text:'',img:null,bg:'g'};
function storyNewView(){
  return `<div class="card"><div class="row between"><a class="back" style="margin:0" href="javascript:history.back()">✕</a><b>Créer une story</b><button class="btn pri sm" onclick="publishStory()">Partager</button></div>
  <p class="muted small" style="margin:6px 0 10px">Votre story est visible pendant 24 heures.</p>
  ${SD.img?`<div style="position:relative"><img src="${SD.img}" style="width:100%;max-height:420px;object-fit:contain;background:#000;border-radius:10px" alt=""><button class="x" style="position:absolute;top:8px;right:8px;border:0;background:rgba(0,0,0,.6);color:#fff;width:30px;height:30px;border-radius:50%" onclick="SD.img=null;render()">✕</button></div>
  <input style="margin-top:8px" placeholder="Ajouter une légende (facultatif)" value="${esc(SD.text)}" oninput="SD.text=this.value">`
  :`<textarea class="ctext onbg ${SD.bg==='ci'?'ci':''}" style="background:${BGS[SD.bg]}" placeholder="Commencez à écrire…" oninput="SD.text=this.value">${esc(SD.text)}</textarea>
  <div class="bgs">${Object.keys(BGS).map(k=>`<button style="background:${BGS[k]}" class="${SD.bg===k?'on':''}" onclick="SD.bg='${k}';render()"></button>`).join('')}</div>`}
  <label class="btn full">📷 ${SD.img?'Changer la photo':'Story avec une photo'}<input type="file" accept="image/*" hidden onchange="pickImg(this,d=>{SD.img=d;render()},1080)"></label></div>`;
}
function publishStory(){
  if(!SD.img&&!SD.text.trim())return toast('Écrivez un texte ou ajoutez une photo');
  S.stories.push({id:uid(),author:ME().id,img:SD.img,text:SD.text.trim(),bg:SD.bg,ts:Date.now(),views:[]});
  SD={text:'',img:null,bg:'g'};save();toast('Story partagée ✅');nav('#/feed');
}
let ST={author:null,i:0},stT=null;
function storyView(aid){
  const au=storyAuthors();const a=au.find(x=>x.id===aid);
  if(!a){setTimeout(()=>go('#/feed'),0);return '';}
  if(ST.author!==aid)ST={author:aid,i:0};
  if(ST.i>=a.list.length)ST.i=a.list.length-1;
  const s=a.list[ST.i];const u=U(aid);const me=ME();
  if(aid!==me.id&&!(s.views||[]).includes(me.id)){s.views=[...(s.views||[]),me.id];save();}
  return `<div class="sviewer"><div class="sbars">${a.list.map((x,i)=>`<span class="${i<ST.i?'done':i===ST.i?'cur':''}"><i></i></span>`).join('')}</div>

/* ================= FIL D'ACTUALITÉ ================= */
let feedTab='all';
function greeting(){
  const h=new Date().getHours();
  const g=(h>=19||h<5)?['I ni su','Bonne soirée']:h<12?['I ni sɔgɔma','Bonjour']:h<15?['I ni tile','Bon après-midi']:['I ni wula','Bonsoir'];
  return `<div class="greet"><b>${g[0]}, ${esc(first(ME().name))} 👋</b> <span class="muted small">(${g[1]} en dioula)</span></div>`;
}
function canSee(p,me){
  if((me.hidden||[]).includes(p.id))return false;
  if(!visibleUser(p.author))return false;
  if(p.audience==='friends'&&p.author!==me.id&&!isFriend(me.id,p.author))return false;
  return true;
}
const budgetDone=a=>a.maxViews&&(a.views||0)>=a.maxViews;
const isAdLive=a=>{const n=Date.now();return a.active&&a.status==='ok'&&!a.paused&&(!a.startsAt||a.startsAt<=n)&&(!a.endsAt||a.endsAt>n)&&!budgetDone(a);};
function ageOf(b){if(!b)return null;const d=new Date(b+'T12:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a;}
function audienceMatch(a,u){
  if(a.targetCity&&a.targetCity!==u.city)return false;
  const t=a.audience;if(!t)return true;
  if(t.cities&&t.cities.length&&!t.cities.includes(u.city))return false;
  if(t.gender&&t.gender!=='all'&&u.gender&&u.gender!==t.gender)return false;
  const age=ageOf(u.birthday);if(age!==null&&(age<(t.ageMin||13)||age>(t.ageMax||99)))return false;
  if(t.interests&&t.interests.length&&u.interests&&u.interests.length&&!t.interests.some(i=>u.interests.includes(i)))return false;
  return true;
}
const seenAds=new Set();
function feedView(){
  const me=ME();const now=Date.now();
  let posts=S.posts.filter(p=>!p.groupId&&canSee(p,me));
  if(feedTab==='city')posts=posts.filter(p=>p.city&&p.city===me.city);
  if(feedTab==='friends')posts=posts.filter(p=>p.author===me.id||isFriend(me.id,p.author));
  if(feedTab==='alerts')posts=posts.filter(p=>p.kind==='alert'&&p.city===me.city);
  const ordered=feedTab==='all'?[...posts.filter(p=>p.boostedUntil>now),...posts.filter(p=>!(p.boostedUntil>now))]:posts;
  const ads=S.ads.filter(a=>isAdLive(a)&&audienceMatch(a,me)&&a.owner!==me.id);
  const out=[];let ai=0,seen=false;
  const show=a=>{const c=adCard(a);if(!c)return;if(!seenAds.has(a.id)){seenAds.add(a.id);a.views=(a.views||0)+1;if(!(a.viewers||[]).includes(me.id))a.viewers=[...(a.viewers||[]),me.id];seen=true;}out.push(c);};
  const alerts=S.posts.filter(p=>p.kind==='alert'&&p.city===me.city&&now-p.ts<2*864e5&&canSee(p,me)).length;
  ordered.forEach((p,i)=>{
    out.push(postCard(p));
    if(i===1&&feedTab==='all')out.push(peopleCard());
    if((i+1)%4===0&&ads.length)show(ads[ai++%ads.length]);
  });
  if(ordered.length<4&&ads.length)show(ads[0]);
  if(seen)save();
  const chips=[['all','🌍 Pour vous'],['city',`📍 ${esc(me.city||'Ma ville')}`],['friends','👥 Amis'],['alerts',`⚠️ Alertes${alerts?` (${alerts})`:''}`]];
  return greeting()+storiesBar()+birthdayCard()+composer()
    +`<div class="chips">${chips.map(c=>`<button class="chip ${feedTab===c[0]?'on':''}" onclick="feedTab='${c[0]}';render()">${c[1]}</button>`).join('')}</div>`
    +(feedTab==='city'&&!me.city?`<div class="card center">Indiquez votre ville dans votre profil. <a href="#/edit-profile">Modifier</a></div>`:'')
    +(out.join('')||empty(feedTab==='alerts'?`Aucune alerte récente à ${esc(me.city||'votre ville')} 👍`:'Aucune publication pour le moment. Soyez le premier !'));
}
function peopleCard(){
  const sg=suggestions(10);if(!sg.length)return '';
  return `<div class="card"><h3>Vous connaissez peut-être</h3><div class="hscroll">${sg.map(u=>{const mu=mutual(ME().id,u.id);const st=friendStatus(ME().id,u.id);return `<div class="pcard"><a href="#/profile/${u.id}" class="ph">${avatar(u,80)}</a><b class="small" style="display:block;padding:0 6px">${esc(u.name)}</b><div class="muted tiny">${mu?plural(mu,'ami')+' en commun':'📍 '+esc(u.city||'')}</div>${st==='sent'?'<button class="btn sm" disabled style="margin-top:6px">Envoyée</button>':`<button class="btn soft sm" style="margin-top:6px" onclick="addFriend('${u.id}')">➕ Ajouter</button>`}</div>`;}).join('')}</div></div>`;
}
function isBirthday(u){if(!u.birthday)return false;const d=new Date();return u.birthday.slice(5)===`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function birthdayCard(){
  const bs=friendsOf(ME().id).filter(isBirthday);if(!bs.length)return '';

  const p=S.posts.find(x=>x.id===id);

function adSources(){const me=ME();const s=[];if(me.pro)s.push({id:'me',name:me.name+' (compte pro)'});myPages().forEach(p=>s.push({id:p.id,name:'Page : '+p.name}));return s;}
const dayMs=864e5,todayStr=()=>new Date().toISOString().slice(0,10),addDays=(d,n)=>new Date(new Date(d+'T12:00').getTime()+n*dayMs).toISOString().slice(0,10);
function adCalc(x){
  const days=Math.max(1,Math.round((new Date(x.end+'T12:00')-new Date(x.start+'T12:00'))/dayMs)+1);
  const total=Math.round(x.budgetType==='daily'?(+x.budget||0)*days:(+x.budget||0));
  const views=Math.floor(total/CONFIG.ads.cpm*1000);
  const reach=S.users.filter(u=>!u.blocked&&!u.isAdmin&&audienceMatch({audience:x.audience||{cities:x.cities,gender:x.gender,ageMin:x.ageMin,ageMax:x.ageMax,interests:x.interests}},u)).length;
  return {days,total,views,reach};
}

function validateAd(id,action){

}

  }
  if(tab==='users'){
    body=`<div class="card">${S.users.map(u=>`<div class="list-item"><a href="#/profile/${u.id}">${avatar(u,44)}</a><div class="grow"><b>${esc(u.name)}</b>${u.blocked?' <span class="tag no">Suspendu</span>':''}${u.pro?' <span class="tag acc">Pro</span>':''}<div class="muted small">📍 ${esc(u.city||'')} · ${S.posts.filter(p=>p.author===u.id).length} publ. · inscrit ${ago(u.joined)}</div></div>${u.isAdmin?'<span class="tag ok">Admin</span>':`<button class="btn sm ${u.blocked?'pri':'red'}" onclick="toggleBlock('${u.id}')">${u.blocked?'Réactiver':'Suspendre'}</button>`}</div>`).join('')}</div>`;
  }
  if(tab==='boosts'){
    const bs=[...S.boosts].sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||b.ts-a.ts);
    body=`<div class="card">${bs.map(b=>{const u=U(b.user)||{name:'?'};const p=S.posts.find(x=>x.id===b.postId);return `<div class="list-item" style="align-items:flex-start"><div class="grow"><b>${esc(b.code)}</b> ${statusTag(b.status)}<div class="small">${esc(u.name)} · ${b.days} j · <b>${fmtF(b.amount)}</b></div><div class="muted small">Réf. paiement : ${esc(b.ref)} · ${ago(b.ts)}</div>${p?`<a class="small" href="#/post/${p.id}">« ${esc((p.text||'Photo').slice(0,60))} »</a>`:'<span class="muted small">Publication supprimée</span>'}
    ${b.status==='pending'?`<div class="row" style="margin-top:6px"><button class="btn pri sm" onclick="validateBoost('${b.id}',true)">✔ Paiement reçu</button><button class="btn red sm" onclick="validateBoost('${b.id}',false)">Refuser</button></div>`:''}</div></div>`;}).join('')||empty('Aucune demande de boost.')}</div>`;
  }
  if(tab==='ads'){
    const card=a=>{const u=U(a.owner)||{name:'?'};const ob=OBJECTIVES[a.objective]||['📣','Campagne'];const t=a.audience||{};const pm=CONFIG.payments.find(m=>m.id===a.payMethod);
      return `<div class="list-item" style="align-items:flex-start"><div class="grow"><b>${esc(a.code)}</b> ${adStatus(a)}<div class="small"><b>${esc(a.title)}</b> — ${esc(a.advertiser)} (par <a href="#/profile/${a.owner}">${esc(u.name)}</a>)</div>
      <div class="muted small">${ob[0]} ${ob[1]} · 👥 ${t.cities&&t.cities.length?esc(t.cities.join(', ')):'Toute la CI'}, ${t.ageMin||'?'}-${t.ageMax||'?'} ans${t.gender&&t.gender!=='all'?(t.gender==='f'?', femmes':', hommes'):''} · 📅 ${esc(a.startDate||'')} → ${esc(a.endDate||'')}</div>
      <div class="small">💰 <b>${fmtF(a.amount)}</b> · ${pm?pm.icon+' '+esc(pm.name):''} ${a.ref?'· réf. <b>'+esc(a.ref)+'</b>':'· pas encore de référence'} · ${ago(a.ts)}</div>
      ${a.objective==='interactions'?`<a class="small" href="#/post/${a.postId}">Voir la publication promue →</a>`:a.img?`<img src="${esc(a.img)}" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;margin-top:6px">`:''}${a.text?`<div class="small muted" style="margin-top:4px">${esc(a.text.slice(0,200))}</div>`:''}
      <div class="row wrap" style="margin-top:6px">${['review','pending'].includes(a.status)?`<button class="btn soft sm" onclick="validateAd('${a.id}','approve')">✔ Approuver le contenu</button>`:''}<button class="btn pri sm" onclick="validateAd('${a.id}','paid')">💰 Paiement reçu → Activer</button><button class="btn red sm" onclick="validateAd('${a.id}','refuse')">✕ Refuser</button><a class="btn sm" href="#/chat/${a.owner}">💬</a><a class="btn sm" href="#/invoice/${a.id}">🧾</a></div></div></div>`;};
    const rev=S.ads.filter(a=>['review','pending'].includes(a.status)),apr=S.ads.filter(a=>a.status==='approved');
    body=`<div class="card"><h3>🔍 À examiner (${rev.length})</h3>${rev.map(card).join('')||'<p class="muted small">Aucune campagne à examiner.</p>'}</div>
    <div class="card"><h3>💳 Approuvées · en attente du paiement (${apr.length})</h3>${apr.map(card).join('')||'<p class="muted small">Aucune.</p>'}</div>
    <div class="card"><h3>Campagnes diffusées</h3>${S.ads.filter(a=>a.status==='ok'||a.status==='refused').map(a=>`<div class="list-item"><div class="grow"><b>${esc(a.title)}</b> ${adStatus(a)}<div class="muted small">${esc(a.advertiser)} · ${a.views||0} affichages · ${(a.viewers||[]).length} pers. · ${a.clicks||0} clics${a.amount?' · '+fmtF(a.amount):''}${a.endsAt?' · fin '+new Date(a.endsAt).toLocaleDateString('fr-FR'):''}</div></div><button class="btn sm" onclick="toggleAd('${a.id}')">${a.active?'Pause':'Activer'}</button><button class="btn red sm" onclick="deleteAd('${a.id}')">🗑️</button></div>`).join('')||empty('Aucune campagne')}</div>
    <div class="card"><h3>Publier une annonce (admin)</h3>
    <input id="aadv" placeholder="Nom de l'annonceur"><input id="atitle" placeholder="Titre de l'annonce"><textarea id="atext" class="big" placeholder="Texte de l'annonce"></textarea>
    <input id="acontact" placeholder="WhatsApp (0544076062) ou lien https://"><input id="acta" placeholder="Texte du bouton (ex. Commander)">
    <input id="azone" list="cities" placeholder="Ville ciblée (vide = toute la Côte d'Ivoire)">${cityList()}
    <label class="btn full" style="margin:0 0 8px">📷 Image de la pub<input type="file" accept="image/*" hidden onchange="pickImg(this,d=>{adImg=d;setPrev('aprev',d)})"></label><img id="aprev" class="imgprev" alt="">
    <button class="btn acc full" onclick="createAd()">Lancer l'annonce</button></div>`;
  }
  if(tab==='reports'){
    body=`<div class="card">${S.reports.map(r=>{const p=S.posts.find(x=>x.id===r.postId);const u=U(r.user)||{name:'?'};const a=p?U(p.author):null;return `<div class="list-item" style="align-items:flex-start"><div class="grow"><span class="tag no">${esc(r.reason)}</span> <span class="muted small">par ${esc(u.name)} · ${ago(r.ts)}</span>${p?`<div class="small" style="margin-top:4px"><b>${esc(a?a.name:'?')}</b> : ${esc((p.text||'Photo').slice(0,120))}</div>`:''}<div class="row" style="margin-top:6px">${p?`<button class="btn red sm" onclick="deletePost('${p.id}')">Supprimer la publication</button><a class="btn sm" href="#/post/${p.id}">Voir</a>`:''}<button class="btn sm" onclick="dismissReport('${r.id}')">Ignorer</button></div></div></div>`;}).join('')||empty('Aucun signalement 👍')}</div>`;
  }
  return `<h2 style="margin:4px 0 8px">🛡️ Administration</h2><div class="tabs">${T.map(t=>`<button class="chip ${t[0]===tab?'on':''}" onclick="go('#/admin/${t[0]}')">${t[1]}${t[0]==='boosts'&&pb?` (${pb})`:''}${t[0]==='ads'&&pa?` (${pa})`:''}${t[0]==='reports'&&S.reports.length?` (${S.reports.length})`:''}</button>`).join('')}</div>${body}`;
}
function toggleBlock(id){const u=U(id);if(!u||u.isAdmin)return;if(!u.blocked&&!confirm(`Suspendre ${u.name} ?`))return;u.blocked=!u.blocked;save();render();}
function validateBoost(id,ok){
  const b=S.boosts.find(x=>x.id===id);if(!b)return;b.status=ok?'ok':'refused';b.decidedAt=Date.now();
  if(ok){const p=S.posts.find(x=>x.id===b.postId);if(p)p.boostedUntil=Math.max(Date.now(),p.boostedUntil||0)+b.days*864e5;notify(b.user,`Votre boost ${b.code} est activé pour ${b.days} jour(s) 🚀`,'#/post/'+b.postId);}
  else notify(b.user,`Votre demande de boost ${b.code} a été refusée. Contactez l'administrateur.`,'#/menu');
  save();render();toast(ok?'Boost activé':'Demande refusée');
}
function createAd(){
  const adv=$('#aadv').value.trim(),title=$('#atitle').value.trim(),text=$('#atext').value.trim();
  if(!adv||!title)return toast("Indiquez l'annonceur et le titre");
  const z=$('#azone').value.trim();
  S.ads.unshift({id:uid(),advertiser:adv,title,text,img:adImg,contact:$('#acontact').value.trim(),ctaType:'whatsapp',cta:$('#acta').value.trim()||'En savoir plus',targetCity:z?normCity(z):null,status:'ok',active:true,views:0,clicks:0,ts:Date.now()});
  adImg=null;save();render();toast('Campagne lancée 📣');
}
function toggleAd(id){const a=S.ads.find(x=>x.id===id);a.active=!a.active;save();render();}
function deleteAd(id){if(!confirm('Supprimer cette campagne ?'))return;S.ads=S.ads.filter(a=>a.id!==id);save();render();}
function dismissReport(id){S.reports=S.reports.filter(r=>r.id!==id);save();render();}
function resetDemo(){if(!confirm('Effacer toutes les données et revenir à la démo ?'))return;try{localStorage.removeItem(CONFIG.storageKey);}catch(e){}location.hash='#/login';location.reload();}

/* ================= INSTALLATION PWA ================= */
let installEvt=null;
const isStandalone=()=>window.matchMedia&&matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;scheduleRender();});
window.addEventListener('appinstalled',()=>{installEvt=null;toast(CONFIG.appName+' est installée sur votre téléphone ✅');scheduleRender();});
function installBtn(cls){return isStandalone()?'':`<button class="btn ${cls||'acc'} full" onclick="installApp()">📲 Installer l'application</button>`;}
function installApp(){
  if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render();});return;}
  modal(`<h3>📲 Installer ${esc(CONFIG.appName)}</h3>${isIOS()
    ?`<ol style="margin-left:18px"><li>Ouvrez ce site dans <b>Safari</b>.</li><li>Touchez le bouton <b>Partager</b> (carré avec une flèche).</li><li>Choisissez <b>« Sur l'écran d'accueil »</b>, puis <b>Ajouter</b>.</li></ol>`
    :`<ol style="margin-left:18px"><li>Ouvrez ce site dans <b>Chrome</b>.</li><li>Touchez le menu <b>⋮</b> en haut à droite.</li><li>Choisissez <b>« Installer l'application »</b> ou <b>« Ajouter à l'écran d'accueil »</b>.</li></ol>`}
    <p class="muted small" style="margin-top:8px">L'icône ${esc(CONFIG.appName)} apparaîtra sur votre écran d'accueil, comme une vraie application.</p>
    <button class="btn full" onclick="closeModal()">Compris</button>`);
}

/* ================= ROUTEUR ================= */
function render(){
  pendingRender=false;
  if(!booted){$('#app').innerHTML=splash('Chargement…');return;}
  const me=ME();const h=location.hash||'#/feed';
  if(!me){
    if(ONLINE&&S.session){$('#app').innerHTML=splash('Chargement de votre compte…');return;}
    $('#app').innerHTML=authView(h==='#/register'?'register':'login');return;
  }
  const [,route,param,sub]=h.split('/');let html;
  if(route==='story'){$('#app').innerHTML=storyView(param);storyArm();return;}
  clearTimeout(stT);
  switch(route){
    case 'post':html=postView(param);break;
    case 'profile':html=profileView(param||me.id,sub);break;
    case 'edit-profile':html=editProfileView();break;
    case 'friends':html=friendsView();break;
    case 'groups':html=groupsView();break;
    case 'group':html=groupView(param);break;
    case 'market':html=marketView();break;
    case 'messages':html=messagesView();break;
    case 'chat':html=chatView(param);break;
    case 'notifs':html=notifsView();break;
    case 'search':html=searchView();break;
    case 'menu':html=menuView();break;
    case 'create':html=createView();break;
    case 'story-new':html=storyNewView();break;
    case 'events':html=eventsView();break;
    case 'event':html=eventView(param);break;
    case 'event-new':html=eventNewView();break;
    case 'saved':html=savedView();break;
    case 'memories':html=memoriesView();break;
    case 'pages':html=pagesView();break;
    case 'page':html=pageView(param);break;
    case 'page-edit':html=pageEditView(param||'new');break;
    case 'ad-new':html=adNewView(param||'me');break;
    case 'my-ads':html=myAdsView();break;
    case 'billing':html=billingView();break;
    case 'invoice':html=invoiceView(param);break;
    case 'admin':html=me.isAdmin?adminView(param||'stats'):feedView();break;
    default:html=feedView();
  }
  $('#app').innerHTML=shell(html);
  const cb=$('#chatbox');if(cb)cb.scrollTop=cb.scrollHeight;
}
window.addEventListener('hashchange',()=>{const m=$('#modal');m.classList.add('hidden');m.innerHTML='';render();window.scrollTo(0,0);if(afterNav){const f=afterNav;afterNav=null;f();}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
load();render();
</script>
</body>
</html>
