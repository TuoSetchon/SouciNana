<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7a4b">
<title>SouciNana</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--pri:#0b7a4b;--acc:#f28c28;--bg:#eef1f4;--card:#fff;--tx:#1c1e21;--mu:#65676b;--bd:#e3e6ea;--red:#d93025}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.4}
a{color:var(--pri);text-decoration:none}
h2{font-size:20px}
header.top{position:fixed;top:0;left:0;right:0;height:56px;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:20}
.logo{font-weight:900;font-size:22px;color:var(--pri);letter-spacing:-.5px}
.top-actions{display:flex;gap:8px}
.ic{position:relative;border:0;background:var(--bg);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.badge{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
main{max-width:640px;margin:0 auto;padding:66px 8px 80px}
.demo{background:#fff3cd;color:#8a6d00;font-size:12px;text-align:center;padding:5px;border-radius:8px;margin-bottom:8px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--card);display:flex;border-top:1px solid var(--bd);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mu);font-size:11px;position:relative}
nav.bottom a .i{font-size:22px}
nav.bottom a.on{color:var(--pri);font-weight:700}
nav.bottom a.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--pri);border-radius:0 0 3px 3px}
nav.bottom .badge{top:4px;right:calc(50% - 22px)}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}.center{justify-content:center;text-align:center}
.grow{flex:1;min-width:0}
.muted{color:var(--mu)}.small{font-size:13px}
.av{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.btn{border:0;background:var(--bg);color:var(--tx);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--pri);color:#fff}.btn.acc{background:var(--acc);color:#fff}.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--mu)}
.btn.full{width:100%;margin-top:8px}.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.6}
input,textarea,select{width:100%;border:1px solid var(--bd);border-radius:8px;padding:11px;font:inherit;background:#fafbfc;margin-bottom:8px}
textarea.big{min-height:80px}
.composer textarea{flex:1;resize:none;min-height:44px;border:0;background:var(--bg);border-radius:20px;padding:11px 14px;margin:0}
.composer .between{margin-top:8px;border-top:1px solid var(--bd);padding-top:8px}
.preview{position:relative;margin-top:8px}.preview img{width:100%;border-radius:8px;max-height:300px;object-fit:cover}
.x{position:absolute;top:6px;right:6px;border:0;background:rgba(0,0,0,.6);color:#fff;width:30px;height:30px;border-radius:50%}
.post{padding:12px 0}.post>*{padding-left:12px;padding-right:12px}
.post-head{display:flex;gap:10px;align-items:center}
.name{font-weight:700;color:var(--tx)}
.post-text{margin:10px 0;word-wrap:break-word}
.post-img{width:100%;max-height:520px;object-fit:cover;display:block;padding:0!important;margin:6px 0}
.post-stats{display:flex;justify-content:space-between;padding-top:6px;padding-bottom:6px}
.post-actions{display:flex;border-top:1px solid var(--bd);margin:0 12px;padding:4px 0 0!important}
.post-actions button{flex:1;border:0;background:none;padding:8px 4px;color:var(--mu);font-weight:600;border-radius:6px;cursor:pointer;font-size:14px}
.post-actions button.on{color:var(--red)}
.cmt{display:flex;gap:8px;margin-top:8px}
.cmt .bub{background:var(--bg);border-radius:14px;padding:7px 11px}
.comment-box{margin-top:10px}.comment-box input{margin:0;border-radius:20px}
.tag{padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;display:inline-block}
.tag.acc{background:#fde7d2;color:#b25b0b}.tag.ok{background:#d7f2e4;color:var(--pri)}.tag.wait{background:#fff3cd;color:#8a6d00}.tag.no{background:#fde0de;color:var(--red)}
.ad{border:1px solid #fbd3ad}
.profile{padding:0;overflow:hidden;text-align:center;padding-bottom:14px}
.cover{height:150px;background:linear-gradient(135deg,var(--pri),var(--acc));background-size:cover;background-position:center}
.pav{margin-top:-50px;display:flex;justify-content:center}.pav .av{border:4px solid #fff}
.profile h2{margin-top:6px}.profile p{margin:4px 12px}
.grid-friends{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.fcell{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx);font-size:13px}
h3{font-size:17px;margin-bottom:6px}
.list-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);color:inherit}.list-item:last-child{border:0}
.chips,.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{border:0;background:var(--card);padding:7px 12px;border-radius:16px;white-space:nowrap;font-weight:600;font-size:13px;cursor:pointer}.chip.on{background:var(--pri);color:#fff}
.market{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mitem{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer}
.mitem .ph{aspect-ratio:1;background:#dde3e8 center/cover;display:flex;align-items:center;justify-content:center;font-size:40px}
.mitem .in{padding:8px}.mitem b{display:block}.price{color:var(--pri);font-weight:800}
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px)}
.chatbox{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:8px 12px;border-radius:18px;background:var(--card)}
.msg.me{align-self:flex-end;background:var(--pri);color:#fff}
.msg .t{font-size:11px;opacity:.7;display:block;text-align:right}
.chat .send{display:flex;gap:6px;padding-top:6px}.chat .send input{margin:0;border-radius:20px}
.notif{display:flex;gap:10px;padding:10px;border-radius:8px;align-items:center;cursor:pointer}.notif.unread{background:#e7f5ee}
.menu a{display:flex;gap:12px;align-items:center;padding:12px 6px;color:var(--tx);font-weight:600;border-bottom:1px solid var(--bd)}
.menu a:last-child{border:0}.menu a span{font-size:22px;width:30px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow-y:auto;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 6px;font-size:15px;border-bottom:1px solid var(--bd);cursor:pointer}
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.offer{border:2px solid var(--bd);border-radius:10px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;cursor:pointer;font-size:14px}
.offer input{display:none}.offer:has(input:checked){border-color:var(--acc);background:#fff6ec}
.pay{background:var(--bg);border-radius:10px;padding:10px;margin-bottom:10px;font-size:14px}.pay ol{margin:6px 0 0 18px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.25s;z-index:60;font-size:14px;max-width:90%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:20px;max-width:420px;margin:0 auto}
.auth-hero{text-align:center;margin-bottom:18px}.auth-logo{font-size:40px;font-weight:900;color:var(--pri)}
.auth-card h2{margin-bottom:12px}
.sep{height:1px;background:var(--bd);margin:14px 0}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--card);border-radius:10px;padding:12px}.stat b{font-size:22px;display:block;color:var(--pri)}
.back{display:inline-block;margin-bottom:8px;font-weight:600}
.imgprev{display:none;width:100%;border-radius:8px;margin-bottom:8px;max-height:260px;object-fit:cover}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>
<script>
/* ================= FIREBASE : collez ici la configuration de votre projet =================
   Tant que apiKey est vide, l'application fonctionne en MODE DÉMO (données sur l'appareil). */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

/* ================= CONFIGURATION ================= */
const CONFIG = {
  appName: "SouciNana",
  slogan: "Le réseau social de Boundiali",
  emailDomain: "soucinana.app",       // les comptes sont créés sous la forme <numéro>@soucinana.app
  adminEmail: "admin@soucinana.app",  // compte administrateur (à créer dans Firebase > Authentication)
  adminLogin: "admin",                // identifiant à taper pour se connecter en admin
  adminPassword: "admin2026",         // utilisé seulement en mode démo
  adminMomo: "07 00 00 00 00",        // numéro Mobile Money / Wave qui reçoit les paiements
  adminWhatsApp: "2250700000000",     // WhatsApp de l'admin (format international, sans +)
  boostOffers: [ {days:1, price:500}, {days:3, price:1200}, {days:7, price:2500} ],
  storageKey: "soucinana_v1"
};

const ONLINE = !!(FIREBASE_CONFIG.apiKey && window.firebase);

/* ================= OUTILS ================= */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtF = n => Number(n||0).toLocaleString('fr-FR') + ' FCFA';
const priceTxt = n => Number(n) > 0 ? fmtF(n) : 'Prix à discuter';
const fmtText = t => esc(t).replace(/\n/g,'<br>').replace(/(^|\s)#([\wÀ-ÿ]+)/g,'$1<b style="color:var(--pri)">#$2</b>');
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return "à l'instant";if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';if(s<604800)return Math.floor(s/86400)+' j';return new Date(ts).toLocaleDateString('fr-FR');}
function hashPw(p){let h=7;for(const c of String(p))h=(h*31+c.charCodeAt(0))|0;return 'h'+h;}
const normPhone = p => String(p||'').replace(/[\s.-]+/g,'');
function color(s){let h=0;for(const c of String(s))h=(h*37+c.charCodeAt(0))%360;return `hsl(${h},55%,45%)`;}
const initials = n => String(n||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const go = h => { location.hash = h; };
const empty = t => `<div class="empty">${t}</div>`;
let tt; function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2800);}
function modal(html){const m=$('#modal');m.innerHTML=`<div class="sheet">${html}</div>`;m.classList.remove('hidden');m.onclick=e=>{if(e.target===m)closeModal();};}
function closeModal(){const m=$('#modal');m.classList.add('hidden');m.innerHTML='';if(pendingRender){pendingRender=false;render();}}
function setPrev(id,d){const e=$('#'+id);if(e){e.src=d;e.style.display='block';}}
function pickImg(input,cb,max=1000){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7));};img.src=e.target.result;};r.readAsDataURL(f);}
function contactHref(c){c=String(c||'').trim();if(/^https?:\/\//i.test(c))return esc(c);return 'https://wa.me/'+c.replace(/\D/g,'');}

/* ================= DONNÉES ================= */
const COLS=['users','posts','groups','listings','ads','friends','requests','messages','notifs','boosts','reports'];
let S, db=null, auth=null, FV=null, unsubs=[], base={}, parts={};
let booted=!ONLINE;
function emptyState(){const s={session:null};COLS.forEach(c=>s[c]=[]);return s;}
const U = id => S.users.find(u=>u.id===id);
const ME = () => S.users.find(u=>u.id===S.session && !u.blocked);
const visibleUser = id => { const u=U(id); return u && !u.blocked; };
function notify(to,text,link){S.notifs.unshift({id:uid(),to,text,link,ts:Date.now(),read:false});if(!ONLINE)S.notifs=S.notifs.slice(0,300);}

function load(){
  if(ONLINE){
    S=emptyState();
    firebase.initializeApp(FIREBASE_CONFIG);
    auth=firebase.auth(); db=firebase.firestore(); FV=firebase.firestore.FieldValue;
    try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
    auth.onAuthStateChanged(onAuth);
    return;
  }
  try{S=JSON.parse(localStorage.getItem(CONFIG.storageKey));}catch(e){S=null;}
  if(!S||!S.users||!S.friends||Array.isArray(S.friends[0]))S=seed();
}

/* --- Synchronisation Firestore : chaque modification de S est envoyée au serveur --- */
const fail=e=>{console.warn(e);toast(e&&e.code==='permission-denied'?'Action non autorisée':'Problème de connexion, réessayez');};
const clean=o=>JSON.parse(JSON.stringify(o));
const INC_KEYS=['shares','views','clicks'];
function save(){
  if(!ONLINE){try{localStorage.setItem(CONFIG.storageKey,JSON.stringify(S));}catch(e){toast('Mémoire pleine : supprimez quelques photos.');}return;}
  for(const c of COLS){
    const b=base[c]||{},nb={},cur={};
    S[c].forEach(d=>{if(!d.id)d.id=uid();cur[d.id]=d;});
    for(const id in cur){
      const js=JSON.stringify(cur[id]);nb[id]=js;if(js===b[id])continue;
      const ref=db.collection(c).doc(id);
      if(b[id]&&(c==='posts'||c==='groups'||c==='ads')){
        const old=JSON.parse(b[id]),neu=cur[id],upd={};
        for(const k of new Set([...Object.keys(old),...Object.keys(neu)])){
          const o=old[k],n=neu[k];if(JSON.stringify(o)===JSON.stringify(n))continue;
          if(Array.isArray(o)&&Array.isArray(n)){
            const os=o.map(x=>JSON.stringify(x)),ns=n.map(x=>JSON.stringify(x));
            const add=n.filter((x,i)=>!os.includes(ns[i])),rem=o.filter((x,i)=>!ns.includes(os[i]));
            upd[k]=(add.length&&rem.length)?clean(n):add.length?FV.arrayUnion(...clean(add)):FV.arrayRemove(...clean(rem));
          }else if(INC_KEYS.includes(k)&&typeof o==='number'&&typeof n==='number')upd[k]=FV.increment(n-o);
          else upd[k]=n===undefined?FV.delete():clean(n);
        }
        ref.update(upd).catch(fail);
      }else ref.set(clean(cur[id])).catch(fail);
    }
    for(const id in b)if(!(id in cur))db.collection(c).doc(id).delete().catch(fail);
    base[c]=nb;
  }
}
const MULTI={messages:['m1','m2'],notifs:['n1','n2']};
function applySnap(col,key,sn){
  parts[key]={};sn.forEach(d=>{parts[key][d.id]={...d.data(),id:d.id};});
  const merged={};(MULTI[col]||[key]).forEach(k=>Object.assign(merged,parts[k]||{}));
  const arr=Object.values(merged);
  if(col==='messages')arr.sort((a,b)=>a.ts-b.ts);
  else if(arr.length&&arr[0].ts!==undefined)arr.sort((a,b)=>b.ts-a.ts);
  S[col]=arr;base[col]={};arr.forEach(d=>base[col][d.id]=JSON.stringify(d));
  if(col==='users'){
    const mine=arr.find(u=>u.id===S.session);
    if(mine&&mine.blocked){toast("Ce compte a été suspendu par l'administrateur");auth.signOut();return;}
  }
  scheduleRender();
}
async function onAuth(user){
  unsubs.forEach(u=>u());unsubs=[];parts={};base={};S=emptyState();COLS.forEach(c=>base[c]={});
  booted=true;
  if(!user){render();return;}
  S.session=user.uid;render();
  const me=user.uid,admin=user.email===CONFIG.adminEmail;
  if(admin){
    const ref=db.collection('users').doc(me);
    const snap=await ref.get().catch(()=>null);
    if(snap&&!snap.exists)await ref.set({id:me,name:'Administrateur '+CONFIG.appName,quartier:'Boundiali',bio:'Compte officiel de '+CONFIG.appName,avatar:null,cover:null,joined:Date.now(),isAdmin:true,blocked:false}).catch(fail);
    seedOnline(me);
  }
  const L=(col,q,key)=>unsubs.push(q.onSnapshot(sn=>applySnap(col,key||col,sn),e=>console.warn(col,e)));
  const C=c=>db.collection(c);
  L('users',C('users'));
  L('posts',C('posts').orderBy('ts','desc').limit(300));
  L('groups',C('groups'));
  L('listings',C('listings').orderBy('ts','desc').limit(300));
  L('ads',C('ads'));
  L('friends',C('friends'));
  L('requests',C('requests'));
  L('messages',C('messages').where('from','==',me),'m1');
  L('messages',C('messages').where('to','==',me),'m2');
  L('notifs',C('notifs').where('to','==',me),'n1');
  if(admin){L('notifs',C('notifs').where('to','==','ADMIN'),'n2');L('boosts',C('boosts'));L('reports',C('reports'));}
  else L('boosts',C('boosts').where('user','==',me));
}
async function seedOnline(me){
  const s=await db.collection('groups').limit(1).get().catch(()=>null);
  if(!s||!s.empty)return;
  const now=Date.now(),b=db.batch();
  [['g1','Boundiali Infos','Actualités et informations utiles de la ville','📢'],['g2','Emplois & Opportunités',"Offres d'emploi, stages et petits boulots",'💼'],['g3','Sport à Boundiali','Matchs, tournois et activités sportives','⚽'],['g4','Jeunesse de Boundiali','Échanges, projets et événements des jeunes','🌱']]
    .forEach(g=>b.set(db.collection('groups').doc(g[0]),{id:g[0],name:g[1],desc:g[2],icon:g[3],members:[me],owner:me}));
  const pid=uid();
  b.set(db.collection('posts').doc(pid),{id:pid,author:me,text:'Bienvenue sur '+CONFIG.appName+' 🎉 Partagez vos nouvelles, vendez sur le Marché et rejoignez les groupes de votre ville !',img:null,ts:now,likes:[],comments:[],groupId:null,boostedUntil:0,shares:0});
  b.set(db.collection('ads').doc('a1'),{id:'a1',advertiser:CONFIG.appName,title:'Votre publicité ici !',text:"Faites connaître votre commerce à toute la ville de Boundiali. Contactez l'administrateur pour lancer votre campagne.",img:null,contact:CONFIG.adminWhatsApp,cta:'Contacter sur WhatsApp',active:true,views:0,clicks:0,ts:now});
  b.commit().catch(fail);
}

/* --- Rendu différé : on ne casse pas la saisie en cours quand des données arrivent --- */
let rq=false,pendingRender=false;
function scheduleRender(){
  if(rq)return;rq=true;
  requestAnimationFrame(()=>{
    rq=false;
    const a=document.activeElement;
    const typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('#app');
    const modalOpen=!$('#modal').classList.contains('hidden');
    if(typing||modalOpen){
      pendingRender=true;
      const r=(location.hash||'').split('/');
      if(r[1]==='chat'&&$('#chatbox')&&ME()){$('#chatbox').innerHTML=chatMsgs(r[2]);markRead(r[2]);const cb=$('#chatbox');cb.scrollTop=cb.scrollHeight;}
      return;
    }
    render();
  });
}
document.addEventListener('focusout',()=>setTimeout(()=>{
  if(!pendingRender)return;const a=document.activeElement;
  if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&$('#modal').classList.contains('hidden')){pendingRender=false;render();}
},200));

/* --- Données de démonstration (mode hors ligne uniquement) --- */
function seed(){
  const now=Date.now(),H=3600e3,D=86400e3;
  const du=(id,name,bio)=>({id,name,phone:'',pw:'',quartier:'Boundiali',bio,avatar:null,cover:null,joined:now-30*D,demo:true,blocked:false});
  const users=[

/* ================= AUTHENTIFICATION ================= */
const toEmail = id => id.trim().toLowerCase()===CONFIG.adminLogin ? CONFIG.adminEmail : normPhone(id).replace(/\D/g,'')+'@'+CONFIG.emailDomain;
function authErr(e){const c=(e&&e.code)||'';
  if(c.includes('email-already-in-use'))return 'Ce numéro a déjà un compte';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')||c.includes('invalid-email'))return 'Numéro ou mot de passe incorrect';
  if(c.includes('weak-password'))return 'Mot de passe trop faible (6 caractères minimum)';
  if(c.includes('network'))return 'Pas de connexion internet';
  if(c.includes('too-many-requests'))return 'Trop de tentatives, réessayez dans quelques minutes';
  return 'Erreur : '+(c||'inconnue');}
function busy(on){document.querySelectorAll('.auth button').forEach(b=>b.disabled=on);}
function authView(mode){
  return `<div class="auth"><div class="auth-hero"><div class="auth-logo">${esc(CONFIG.appName)}</div><p class="muted">${esc(CONFIG.slogan)}</p></div>
  <div class="card auth-card">${mode==='login'?`
    <h2>Connexion</h2>
    <input id="lphone" placeholder="Numéro de téléphone" inputmode="tel" autocomplete="username">
    <input id="lpw" type="password" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn pri full" onclick="doLogin()">Se connecter</button>
    <div class="sep"></div>
    <button class="btn acc full" onclick="go('#/register')">Créer un nouveau compte</button>`:`
    <h2>Inscription</h2>
    <input id="rname" placeholder="Nom et prénoms">
    <input id="rphone" placeholder="Numéro de téléphone" inputmode="tel" autocomplete="username">
    <input id="rq" placeholder="Votre quartier à Boundiali">
    <input id="rpw" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="new-password">
    <button class="btn pri full" onclick="doRegister()">S'inscrire</button>
    <p class="muted center" style="margin-top:12px"><a href="#/login">J'ai déjà un compte</a></p>`}
  </div>${installBtn('ghost')}${ONLINE?'':'<p class="demo">Mode démo : les données restent sur cet appareil</p>'}</div>`;
}
async function doLogin(){
  const id=$('#lphone').value,pw=$('#lpw').value;
  if(!id||!pw)return toast('Entrez votre numéro et votre mot de passe');
  if(ONLINE){busy(true);try{await auth.signInWithEmailAndPassword(toEmail(id),pw);location.hash='#/feed';}catch(e){toast(authErr(e));}busy(false);return;}
  const ph=normPhone(id);
  const u=S.users.find(x=>x.phone&&normPhone(x.phone)===ph&&x.pw===hashPw(pw));
  if(!u)return toast('Numéro ou mot de passe incorrect');
  if(u.blocked)return toast("Ce compte a été suspendu par l'administrateur");
  S.session=u.id;save();location.hash='#/feed';render();
}
async function doRegister(){
  const name=$('#rname').value.trim(),ph=normPhone($('#rphone').value),q=$('#rq').value.trim()||'Boundiali',pw=$('#rpw').value;
  if(name.length<3)return toast('Entrez votre nom complet');
  if(!/^\+?\d{8,14}$/.test(ph))return toast('Numéro de téléphone invalide');
  if(pw.length<6)return toast('Mot de passe : 6 caractères minimum');
  const welcome=`Bienvenue sur ${CONFIG.appName}, ${name.split(' ')[0]} ! Complétez votre profil avec une photo.`;
  if(ONLINE){
    busy(true);
    try{
      const cred=await auth.createUserWithEmailAndPassword(toEmail(ph),pw);const id=cred.user.uid;
      await db.collection('users').doc(id).set({id,name,quartier:q,bio:'',avatar:null,cover:null,joined:Date.now(),isAdmin:false,blocked:false});
      db.collection('groups').doc('g1').update({members:FV.arrayUnion(id)}).catch(()=>{});
      const n1=uid(),n2=uid();
      db.collection('notifs').doc(n1).set({id:n1,to:id,text:welcome,link:'#/edit-profile',ts:Date.now(),read:false}).catch(()=>{});
      db.collection('notifs').doc(n2).set({id:n2,to:'ADMIN',text:`Nouvelle inscription : ${name}`,link:'#/admin/users',ts:Date.now(),read:false}).catch(()=>{});
      location.hash='#/feed';
    }catch(e){toast(authErr(e));}
    busy(false);return;
  }
  if(S.users.some(u=>normPhone(u.phone)===ph))return toast('Ce numéro a déjà un compte');
  const u={id:uid(),name,phone:ph,pw:hashPw(pw),quartier:q,bio:'',avatar:null,cover:null,joined:Date.now(),blocked:false};
  S.users.push(u);
  const g1=S.groups.find(g=>g.id==='g1');if(g1)g1.members.push(u.id);
  notify(u.id,welcome,'#/edit-profile');notify('admin',`Nouvelle inscription : ${name}`,'#/admin/users');
  S.session=u.id;save();location.hash='#/feed';render();
}
function logout(){if(ONLINE){auth.signOut();location.hash='#/login';return;}S.session=null;save();location.hash='#/login';render();}

function publish(gid){

function postCard(p,full){

/* ================= ACTIONS PUBLICATIONS ================= */
function like(id){
  const p=S.posts.find(x=>x.id===id);if(!p)return;const me=ME();p.likes=p.likes||[];
  const i=p.likes.indexOf(me.id);
  if(i>=0)p.likes.splice(i,1);else{p.likes.push(me.id);if(p.author!==me.id)notify(p.author,`${me.name} aime votre publication`,'#/post/'+id);}
  save();render();
}
function addComment(id){
  const i=$('#ctext');const t=i.value.trim();if(!t)return;
  const p=S.posts.find(x=>x.id===id);const me=ME();p.comments=p.comments||[];
  p.comments.push({id:uid(),author:me.id,text:t,ts:Date.now()});
  if(p.author!==me.id)notify(p.author,`${me.name} a commenté votre publication`,'#/post/'+id);
  save();render();setTimeout(()=>{const c=$('#ctext');c&&c.focus();},50);
}
function share(id){
  const p=S.posts.find(x=>x.id===id);if(!p)return;
  const txt=`${(U(p.author)||{}).name} sur ${CONFIG.appName} : ${p.text||''}`;
  p.shares=(p.shares||0)+1;save();render();
  if(navigator.share)navigator.share({title:CONFIG.appName,text:txt,url:location.origin}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Texte copié, collez-le où vous voulez')).catch(()=>{});
}
function postMenu(id){
  const p=S.posts.find(x=>x.id===id);if(!p)return;const me=ME();const mine=p.author===me.id;
  modal(`<h3>Options</h3>
  ${mine?`<button class="opt" onclick="closeModal();boostModal('${id}')">🚀 Booster cette publication</button>`:''}
  ${mine||me.isAdmin?`<button class="opt" onclick="closeModal();deletePost('${id}')">🗑️ Supprimer</button>`:''}

function deletePost(id){
  if(!confirm('Supprimer cette publication ?'))return;
  S.posts=S.posts.filter(p=>p.id!==id);S.reports=S.reports.filter(r=>r.postId!==id);save();

/* ================= VUES ================= */
const seenAds=new Set();
function feedView(){
  const now=Date.now();
  const posts=S.posts.filter(p=>!p.groupId&&visibleUser(p.author));
  const ordered=[...posts.filter(p=>p.boostedUntil>now),...posts.filter(p=>!(p.boostedUntil>now))];
  const ads=S.ads.filter(a=>a.active);const out=[];let ai=0,seen=false;
  const show=a=>{if(!seenAds.has(a.id)){seenAds.add(a.id);a.views=(a.views||0)+1;seen=true;}out.push(adCard(a));};
  ordered.forEach((p,i)=>{out.push(postCard(p));if((i+1)%4===0&&ads.length)show(ads[ai++%ads.length]);});
  if(ordered.length<4&&ads.length)show(ads[0]);
  if(seen)save();
  return composer()+(out.join('')||empty('Aucune publication pour le moment. Soyez le premier !'));
}
function postView(id){
  const p=S.posts.find(x=>x.id===id);
  return `<a class="back" href="javascript:history.back()">← Retour</a>`+(p?postCard(p,true):empty('Publication introuvable'));
}
function friendStatus(a,b){
  if(S.friends.some(f=>(f.a===a&&f.b===b)||(f.a===b&&f.b===a)))return 'friends';
  if(S.requests.some(r=>r.from===a&&r.to===b))return 'sent';
  if(S.requests.some(r=>r.from===b&&r.to===a))return 'received';
  return 'none';
}
function friendsOf(id){return S.friends.filter(f=>f.a===id||f.b===id).map(f=>U(f.a===id?f.b:f.a)).filter(u=>u&&!u.blocked);}
function addFriend(id){
  const me=ME();if(friendStatus(me.id,id)!=='none')return;
  S.requests.push({id:uid(),from:me.id,to:id,ts:Date.now()});
  notify(id,`${me.name} vous a envoyé une demande d'ami`,'#/friends');save();render();toast('Demande envoyée');
  const u=U(id);
  if(!ONLINE&&u&&u.demo)setTimeout(()=>{S.requests=S.requests.filter(r=>!(r.from===me.id&&r.to===id));if(friendStatus(me.id,id)!=='friends')S.friends.push({id:uid(),a:me.id,b:id});notify(me.id,`${u.name} a accepté votre demande d'ami`,'#/profile/'+id);save();render();},2500);
}
function acceptFriend(id){const me=ME();S.requests=S.requests.filter(r=>!(r.from===id&&r.to===me.id));S.friends.push({id:uid(),a:me.id,b:id});notify(id,`${me.name} a accepté votre demande d'ami`,'#/profile/'+me.id);save();render();}
function declineFriend(id){const me=ME();S.requests=S.requests.filter(r=>!(r.from===id&&r.to===me.id));save();render();}
function unfriend(id){if(!confirm('Retirer cet ami ?'))return;const me=ME().id;S.friends=S.friends.filter(f=>!((f.a===id&&f.b===me)||(f.a===me&&f.b===id)));save();render();}

function searchResults(q){

  const us=S.users.filter(u=>!u.blocked&&(u.name||'').toLowerCase().includes(q));
  const gs=S.groups.filter(g=>(g.name||'').toLowerCase().includes(q));
  const ls=S.listings.filter(l=>(l.title||'').toLowerCase().includes(q));
  const ps=S.posts.filter(p=>visibleUser(p.author)&&(p.text||'').toLowerCase().includes(q)).slice(0,10);
  let h='';
  if(us.length)h+=`<div class="card"><h3>Personnes</h3>${us.map(u=>`<a class="list-item" href="#/profile/${u.id}">${avatar(u,40)}<b>${esc(u.name)}</b></a>`).join('')}</div>`;

  if(ls.length)h+=`<div class="card"><h3>Marché</h3>${ls.map(l=>`<div class="list-item" onclick="listingModal('${l.id}')" style="cursor:pointer"><span style="font-size:24px">📦</span><div class="grow"><b>${esc(l.title)}</b><div class="price small">${priceTxt(l.price)}</div></div></div>`).join('')}</div>`;
  if(ps.length)h+=`<h3 style="margin:6px 4px">Publications</h3>`+ps.map(p=>postCard(p)).join('');
  return h||'<div class="empty">Aucun résultat</div>';
}

    body=`<div class="stats">${st.map(s=>`<div class="stat"><b>${s[1]}</b><span class="muted small">${s[0]}</span></div>`).join('')}</div>
    ${ONLINE?'':`<div class="card"><h3>Données</h3><p class="muted small">Mode démo : les données sont enregistrées sur cet appareil.</p><button class="btn red full" onclick="resetDemo()">Réinitialiser toutes les données</button></div>`}`;
  }
  if(tab==='users'){
    body=`<div class="card">${S.users.map(u=>`<div class="list-item"><a href="#/profile/${u.id}">${avatar(u,44)}</a><div class="grow"><b>${esc(u.name)}</b>${u.blocked?' <span class="tag no">Suspendu</span>':''}<div class="muted small">📍 ${esc(u.quartier||'')} · ${S.posts.filter(p=>p.author===u.id).length} publ. · inscrit ${ago(u.joined)}</div></div>${u.isAdmin?'<span class="tag ok">Admin</span>':`<button class="btn sm ${u.blocked?'pri':'red'}" onclick="toggleBlock('${u.id}')">${u.blocked?'Réactiver':'Suspendre'}</button>`}</div>`).join('')}</div>`;
  }
  if(tab==='boosts'){
    const bs=[...S.boosts].sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||b.ts-a.ts);
    body=`<div class="card">${bs.map(b=>{const u=U(b.user)||{name:'?'};const p=S.posts.find(x=>x.id===b.postId);return `<div class="list-item" style="align-items:flex-start"><div class="grow"><b>${esc(b.code)}</b> ${statusTag(b.status)}<div class="small">${esc(u.name)} · ${b.days} j · <b>${fmtF(b.amount)}</b></div><div class="muted small">Réf. paiement : ${esc(b.ref)} · ${ago(b.ts)}</div>${p?`<a class="small" href="#/post/${p.id}">« ${esc((p.text||'Photo').slice(0,60))} »</a>`:'<span class="muted small">Publication supprimée</span>'}
    ${b.status==='pending'?`<div class="row" style="margin-top:6px"><button class="btn pri sm" onclick="validateBoost('${b.id}',true)">✔ Paiement reçu</button><button class="btn red sm" onclick="validateBoost('${b.id}',false)">Refuser</button></div>`:''}</div></div>`;}).join('')||empty('Aucune demande de boost.')}</div>`;
  }
  if(tab==='ads'){
    body=`<div class="card"><h3>Nouvelle campagne sponsorisée</h3>
    <input id="aadv" placeholder="Nom de l'annonceur"><input id="atitle" placeholder="Titre de l'annonce"><textarea id="atext" class="big" placeholder="Texte de l'annonce"></textarea>
    <input id="acontact" placeholder="WhatsApp (2250700000000) ou lien https://"><input id="acta" placeholder="Texte du bouton (ex. Commander)">
    <label class="btn full" style="margin:0 0 8px">📷 Image de la pub<input type="file" accept="image/*" hidden onchange="pickImg(this,d=>{adImg=d;setPrev('aprev',d)})"></label><img id="aprev" class="imgprev" alt="">
    <button class="btn acc full" onclick="createAd()">Lancer la campagne</button></div>
    <div class="card"><h3>Campagnes</h3>${S.ads.map(a=>`<div class="list-item"><div class="grow"><b>${esc(a.title)}</b> ${a.active?'<span class="tag ok">Active</span>':'<span class="tag wait">En pause</span>'}<div class="muted small">${esc(a.advertiser)} · ${a.views||0} vues · ${a.clicks||0} clics</div></div><button class="btn sm" onclick="toggleAd('${a.id}')">${a.active?'Pause':'Activer'}</button><button class="btn red sm" onclick="deleteAd('${a.id}')">🗑️</button></div>`).join('')||empty('Aucune campagne')}</div>`;
  }
  if(tab==='reports'){
    body=`<div class="card">${S.reports.map(r=>{const p=S.posts.find(x=>x.id===r.postId);const u=U(r.user)||{name:'?'};const a=p?U(p.author):null;return `<div class="list-item" style="align-items:flex-start"><div class="grow"><span class="tag no">${esc(r.reason)}</span> <span class="muted small">par ${esc(u.name)} · ${ago(r.ts)}</span>${p?`<div class="small" style="margin-top:4px"><b>${esc(a?a.name:'?')}</b> : ${esc((p.text||'Photo').slice(0,120))}</div>`:''}<div class="row" style="margin-top:6px">${p?`<button class="btn red sm" onclick="deletePost('${p.id}')">Supprimer la publication</button><a class="btn sm" href="#/post/${p.id}">Voir</a>`:''}<button class="btn sm" onclick="dismissReport('${r.id}')">Ignorer</button></div></div></div>`;}).join('')||empty('Aucun signalement 👍')}</div>`;
  }
  return `<h2 style="margin-bottom:8px">🛡️ Administration</h2><div class="tabs">${T.map(t=>`<button class="chip ${t[0]===tab?'on':''}" onclick="go('#/admin/${t[0]}')">${t[1]}${t[0]==='boosts'&&pb?` (${pb})`:''}${t[0]==='reports'&&S.reports.length?` (${S.reports.length})`:''}</button>`).join('')}</div>${body}`;
}
function toggleBlock(id){const u=U(id);if(!u||u.isAdmin)return;if(!u.blocked&&!confirm(`Suspendre ${u.name} ?`))return;u.blocked=!u.blocked;save();render();}
function validateBoost(id,ok){
  const b=S.boosts.find(x=>x.id===id);if(!b)return;b.status=ok?'ok':'refused';b.decidedAt=Date.now();
  if(ok){const p=S.posts.find(x=>x.id===b.postId);if(p)p.boostedUntil=Math.max(Date.now(),p.boostedUntil||0)+b.days*86400e3;notify(b.user,`Votre boost ${b.code} est activé pour ${b.days} jour(s) 🚀`,'#/post/'+b.postId);}
  else notify(b.user,`Votre demande de boost ${b.code} a été refusée. Contactez l'administrateur.`,'#/menu');
  save();render();toast(ok?'Boost activé':'Demande refusée');
}
function createAd(){
  const adv=$('#aadv').value.trim(),title=$('#atitle').value.trim(),text=$('#atext').value.trim();
  if(!adv||!title)return toast("Indiquez l'annonceur et le titre");
  S.ads.unshift({id:uid(),advertiser:adv,title,text,img:adImg,contact:$('#acontact').value.trim(),cta:$('#acta').value.trim()||'En savoir plus',active:true,views:0,clicks:0,ts:Date.now()});
  adImg=null;save();render();toast('Campagne lancée 📣');
}
function toggleAd(id){const a=S.ads.find(x=>x.id===id);a.active=!a.active;save();render();}
function deleteAd(id){if(!confirm('Supprimer cette campagne ?'))return;S.ads=S.ads.filter(a=>a.id!==id);save();render();}
function dismissReport(id){S.reports=S.reports.filter(r=>r.id!==id);save();render();}
function resetDemo(){if(!confirm('Effacer toutes les données et revenir à la démo ?'))return;try{localStorage.removeItem(CONFIG.storageKey);}catch(e){}location.hash='#/login';location.reload();}

/* ================= INSTALLATION PWA ================= */
let installEvt=null;
const isStandalone=()=>window.matchMedia&&matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;scheduleRender();});
window.addEventListener('appinstalled',()=>{installEvt=null;toast(CONFIG.appName+' est installée sur votre téléphone ✅');scheduleRender();});
function installBtn(cls){return isStandalone()?'':`<button class="btn ${cls||'acc'} full" onclick="installApp()">📲 Installer l'application</button>`;}
function installApp(){
  if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render();});return;}
  modal(`<h3>📲 Installer ${esc(CONFIG.appName)}</h3>${isIOS()
    ?`<ol style="margin-left:18px"><li>Ouvrez ce site dans <b>Safari</b>.</li><li>Touchez le bouton <b>Partager</b> (carré avec une flèche).</li><li>Choisissez <b>« Sur l'écran d'accueil »</b>, puis <b>Ajouter</b>.</li></ol>`
    :`<ol style="margin-left:18px"><li>Ouvrez ce site dans <b>Chrome</b>.</li><li>Touchez le menu <b>⋮</b> en haut à droite.</li><li>Choisissez <b>« Installer l'application »</b> ou <b>« Ajouter à l'écran d'accueil »</b>.</li></ol>`}
    <p class="muted small" style="margin-top:8px">L'icône ${esc(CONFIG.appName)} apparaîtra sur votre écran d'accueil, comme une vraie application.</p>
    <button class="btn full" onclick="closeModal()">Compris</button>`);
}

/* ================= ROUTEUR ================= */
function render(){
  pendingRender=false;
  if(!booted){$('#app').innerHTML=splash('Chargement…');return;}
  const me=ME();const h=location.hash||'#/feed';
  if(!me){
    if(ONLINE&&S.session){$('#app').innerHTML=splash('Chargement de votre compte…');return;}
    $('#app').innerHTML=authView(h==='#/register'?'register':'login');return;
  }
  const [,route,param]=h.split('/');let html;
  switch(route){
    case 'post':html=postView(param);break;
    case 'profile':html=profileView(param||me.id);break;
    case 'edit-profile':html=editProfileView();break;
    case 'friends':html=friendsView();break;
    case 'groups':html=groupsView();break;
    case 'group':html=groupView(param);break;
    case 'market':html=marketView();break;
    case 'messages':html=messagesView();break;
    case 'chat':html=chatView(param);break;
    case 'notifs':html=notifsView();break;
    case 'search':html=searchView();break;
    case 'menu':html=menuView();break;
    case 'admin':html=me.isAdmin?adminView(param||'stats'):feedView();break;
    default:html=feedView();
  }
  $('#app').innerHTML=shell(html);
  const cb=$('#chatbox');if(cb)cb.scrollTop=cb.scrollHeight;
}
window.addEventListener('hashchange',()=>{const m=$('#modal');m.classList.add('hidden');m.innerHTML='';render();window.scrollTo(0,0);});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
load();render();
</script>
</body>
